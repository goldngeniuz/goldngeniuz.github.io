imary\" id=\"fcFlip\">Flip\u003c/button>\n      \u003cbutton class=\"btn\" id=\"fcNext\">Next →\u003c/button>\n      \u003cbutton class=\"btn gold\" id=\"fcShuffle\" style=\"grid-column:1/-1\">🔀 Shuffle Deck\u003c/button>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- ============ QUIZ ============ -->\n  \u003csection id=\"quiz\" class=\"panel\">\n    \u003cdiv id=\"quizBody\">\u003c/div>\n  \u003c/section>\n\n  \u003cfooter>\n    Au-CHIVES · Student Advance Physics Workbook\u003cbr>\n    © Gold'n Geniuz Online Tutoring Services — Kingston, Jamaica\n  \u003c/footer>\n\u003c/div>\n\n\u003cscript>\n/* ============================================================\n   VOCABULARY — 20 KEY CSEC PHYSICS TERMS\n   (VOL 01 · ISS #1 — U1 MECHANICS: Physical Quantities)\n   ============================================================ */\nconst CARDS = [\n  { term:\"Physical Quantity\", tag:\"Foundations\",\n    def:\"A quantity that consists of TWO essential parts: a numerical magnitude AND a unit. Writing “the length is 12” is meaningless — 12 m, 12 cm and 12 mm are all different measurements.\" },\n\n  { term:\"SI Base / Derived Unit\", tag:\"Foundations\",\n    def:\"The standard unit attached to a measured quantity. Base units include metre (m), kilogram (kg), second (s), kelvin (K) and ampere (A). Derived units combine base units, e.g. N = kg·m·s⁻².\" },\n\n  { term:\"Scalar Quantity\", tag:\"Vectors\",\n    def:\"A quantity that has magnitude (size) only — no direction. Examples: distance, speed, mass, temperature, energy, time, work and power.\" },\n\n  { term:\"Vector Quantity\", tag:\"Vectors\",\n    def:\"A quantity that has BOTH magnitude and direction. Examples: displacement, velocity, force, acceleration, momentum and gravitational field strength.\" },\n\n  { term:\"Distance vs Displacement\", tag:\"Vectors\",\n    def:\"Distance is a SCALAR (magnitude only) — how far you travelled. Displacement is a VECTOR (magnitude + direction) — the straight-line change in position from start to finish.\" },\n\n  { term:\"Speed vs Velocity\", tag:\"Vectors\",\n    def:\"Speed is a SCALAR (magnitude only). Velocity is a VECTOR — speed in a stated direction. A car going 60 km/h has a speed; going 60 km/h due north, it has a velocity.\" },\n\n  { term:\"Resolving a Vector\", tag:\"Vectors\",\n    def:\"Breaking a single vector down into two perpendicular components, usually along the horizontal (x) and vertical (y) axes. This makes vector addition and analysis far easier.\" },\n\n  { term:\"Horizontal Component\", tag:\"Vectors\",\n    def:\"For a vector F at angle θ to the horizontal: Fx = F cos θ. It is the “shadow” of the vector along the x-axis.\" },\n\n  { term:\"Vertical Component\", tag:\"Vectors\",\n    def:\"For a vector F at angle θ to the horizontal: Fy = F sin θ. It is the “shadow” of the vector along the y-axis.\" },\n\n  { term:\"Resultant from Components\", tag:\"Vectors\",\n    def:\"If the components Fx and Fy are known, the magnitude of the original vector is found using Pythagoras: F = √(Fx² + Fy²).\" },\n\n  { term:\"Direction of a Vector\", tag:\"Vectors\",\n    def:\"Found from the components using trigonometry: θ = tan⁻¹(Fy / Fx), measured from the horizontal (x-axis).\" },\n\n  { term:\"Range (Instrument)\", tag:\"Measurement\",\n    def:\"The smallest and largest values an instrument is able to measure. The instrument's range must cover all the values you expect in your experiment.\" },\n\n  { term:\"Zero Error\", tag:\"Measurement\",\n    def:\"A systematic error present when an instrument does not read zero when it should. Always check for zero error BEFORE measuring and correct readings accordingly.\" },\n\n  { term:\"Calibration Curve\", tag:\"Graphing\",\n    def:\"A graph showing the relationship between what an instrument READS and the TRUE value, obtained by comparing it against a standard reference instrument.\" },\n\n  { term:\"Line of Best Fit\", tag:\"Graphing\",\n    def:\"A single smooth line (or curve) drawn through plotted points to show the general trend. There should be roughly equal numbers of points above and below the line.\" },\n\n  { term:\"Linearization\", tag:\"Graphing\",\n    def:\"Rearranging a non-linear relationship into the straight-line form y = mx + c by choosing appropriate quantities to plot. E.g. y = kx² → plot y vs x²; y = k/x → plot y vs 1/x; y = ae^(bx) → plot ln y vs x.\" },\n\n  { term:\"Precision (Measurement)\", tag:\"Uncertainty\",\n    def:\"How close repeated measurements are to EACH OTHER — also called reproducibility. Good precision means readings cluster tightly together. Affected by random errors.\" },\n\n  { term:\"Accuracy\", tag:\"Uncertainty\",\n    def:\"How close a measurement is to the TRUE value. Affected by systematic errors. You can be precise but not accurate (clustered but off-target) or accurate but not precise (scattered but averaging near the true value).\" },\n\n  { term:\"Absolute Uncertainty\", tag:\"Uncertainty\",\n    def:\"The uncertainty expressed in the SAME UNITS as the measurement itself. Example: (5.2 ± 0.1) cm — the true value lies between 5.1 cm and 5.3 cm.\" },\n\n  { term:\"Percentage Uncertainty\", tag:\"Uncertainty\",\n    def:\"The fractional uncertainty (Δx / x) multiplied by 100%. It lets you compare the reliability of measurements of different sizes. For powers: %unc in xⁿ = n × %unc in x.\" }\n];\n\n/* ============================================================\n   QUIZ — 20 QUESTIONS\n   ============================================================ */\nconst QUESTIONS = [\n  { q:\"A physical quantity must consist of:\",\n    options:[\"A numerical magnitude only\",\"A unit only\",\"Both a numerical magnitude and a unit\",\"A direction and a magnitude\"],\n    answer:2,\n    explain:\"A physical quantity = numerical magnitude + unit. Writing “length is 12” is meaningless without specifying metres, centimetres, etc.\" },\n\n  { q:\"Which of the following is a SCALAR quantity?\",\n    options:[\"Velocity\",\"Displacement\",\"Force\",\"Mass\"],\n    answer:3,\n    explain:\"Mass has magnitude only — no direction. Velocity, displacement and force all require a direction, so they are vectors.\" },\n\n  { q:\"Which set contains ONLY vector quantities?\",\n    options:[\"Velocity, displacement, force\",\"Speed, distance, mass\",\"Acceleration, work, momentum\",\"Energy, power, temperature\"],\n    answer:0,\n    explain:\"Velocity, displacement and force all have magnitude AND direction. Work, energy, power and temperature are scalars.\" },\n\n  { q:\"A force of 50 N acts at 30° above the horizontal. Its horizontal component is:\",\n    options:[\"25.0 N\",\"43.3 N\",\"50.0 N\",\"86.6 N\"],\n    answer:1,\n    explain:\"Fx = F cos θ = 50 × cos 30° = 50 × 0.866 = 43.3 N.\" },\n\n  { q:\"The vertical component of a force F acting at angle θ to the horizontal is:\",\n    options:[\"F cos θ\",\"F sin θ\",\"F tan θ\",\"F / sin θ\"],\n    answer:1,\n    explain:\"The vertical (y) component uses sine: Fy = F sin θ. The horizontal component uses cosine: Fx = F cos θ.\" },\n\n  { q:\"A velocity vector has components vx = 12 m/s and vy = 5 m/s. Its magnitude is:\",\n    options:[\"7 m/s\",\"13 m/s\",\"17 m/s\",\"60 m/s\"],\n    answer:1,\n    explain:\"Magnitude = √(vx² + vy²) = √(12² + 5²) = √(144 + 25) = √169 = 13 m/s.\" },\n\n  { q:\"For the velocity vector above (vx = 12, vy = 5), the angle to the horizontal is approximately:\",\n    options:[\"22.6°\",\"45.0°\",\"65.4°\",\"67.4°\"],\n    answer:0,\n    explain:\"θ = tan⁻¹(vy / vx) = tan⁻¹(5 / 12) = tan⁻¹(0.4167) ≈ 22.6°.\" },\n\n  { q:\"Which instrument is most appropriate for measuring the internal diameter of a small metal pipe with precision to 0.01 mm?\",\n    options:[\"Metre rule\",\"Measuring tape\",\"Vernier caliper\",\"Top-pan balance\"],\n    answer:2,\n    explain:\"A vernier caliper has the fine sensitivity required for small internal diameters. A metre rule (1 mm) is far too coarse and a top-pan balance measures mass, not length.\" },\n\n  { q:\"The primary purpose of constructing and using a calibration curve is to:\",\n    options:[\"Eliminate random errors completely\",\"Convert instrument sensor readings into standardized physical units by comparing against known standards\",\"Calculate the percentage uncertainty of a single reading\",\"Force a non-linear relationship to pass through the origin\"],\n    answer:1,\n    explain:\"A calibration curve maps what an instrument READS against the TRUE value (from a reference standard), letting you convert future readings into accurate physical values.\" },\n\n  { q:\"When constructing a calibration curve for a thermistor to measure temperature, which is plotted on the axes?\",\n    options:[\"Measured resistance (or voltage) on the y-axis against known temperature on the x-axis\",\"Time on the y-axis against temperature on the x-axis\",\"Unknown temperature on the y-axis against unknown resistance on the x-axis\",\"Percentage uncertainty on the y-axis against resistance on the x-axis\"],\n    answer:0,\n    explain:\"The known/standard quantity (temperature from a reference thermometer) goes on the x-axis; the instrument's raw reading (resistance or voltage) goes on the y-axis.\" },\n\n  { q:\"Given the non-linear relationship y = axⁿ, which transformation gives a straight-line graph?\",\n    options:[\"Plot y against x²\",\"Plot √y against √x\",\"Plot ln(y) against ln(x)\",\"Plot 1/y against 1/x\"],\n    answer:2,\n    explain:\"Taking logs: ln y = ln a + n ln x. Plotting ln y vs ln x gives a straight line of gradient n and y-intercept ln a.\" },\n\n  { q:\"A student wishes to test the relationship T² = kL for a simple pendulum. Which graph gives a straight line through the origin?\",\n    options:[\"T against L\",\"T² against L\",\"√T against √L\",\"1/T against L\"],\n    answer:1,\n    explain:\"T² = kL is already in the form y = mx with y = T² and x = L; the gradient is k and the line passes through the origin.\" },\n\n  { q:\"For the inverse relationship V = k/P, which graph would give a straight line?\",\n    options:[\"V against P\",\"V against 1/P\",\"1/V against 1/P\",\"V² against P\"],\n    answer:1,\n    explain:\"Rearranging V = k/P gives V = k(1/P), so plotting V against 1/P gives a straight line through the origin with gradient k.\" },\n\n  { q:\"For the exponential relationship N = N₀e^(λt), which transformation gives a straight line?\",\n    options:[\"Plot N against t\",\"Plot ln(N) against t\",\"Plot 1/N against t\",\"Plot N² against t\"],\n    answer:1,\n    explain:\"Taking natural logs: ln N = ln N₀ + λt. Plotting ln N against t gives a straight line with gradient λ and intercept ln N₀.\" },\n\n  { q:\"An archer's arrows cluster tightly in the bottom-left corner, far from the bullseye. This represents:\",\n    options:[\"Accurate but not precise\",\"Both accurate and precise\",\"Precise but not accurate\",\"Neither accurate nor precise\"],\n    answer:2,\n    explain:\"The arrows are close together (high precision) but far from the centre (low accuracy) — the classic signature of a systematic error.\" },\n\n  { q:\"A thermometer consistently reads 2°C higher than the actual temperature. This indicates a problem with:\",\n    options:[\"Precision\",\"Accuracy\",\"Range\",\"Sensitivity\"],\n    answer:1,\n    explain:\"A consistent offset in one direction is a SYSTEMATIC error, which affects accuracy (closeness to true value), not precision (consistency of repeats).\" },\n\n  { q:\"The period T = 2π√(L/g). If the %uncertainty in L is 2% and in g is 1%, the %uncertainty in T is:\",\n    options:[\"0.5%\",\"1.5%\",\"3.0%\",\"5.0%\"],\n    answer:1,\n    explain:\"T ∝ L^(1/2) g^(−1/2). %unc T = ½(%unc L) + ½(%unc g) = ½(2%) + ½(1%) = 1.5%.\" },\n\n  { q:\"When adding or subtracting quantities (z = x ± y), uncertainties are combined by:\",\n    options:[\"Adding fractional uncertainties\",\"Adding absolute uncertainties\",\"Multiplying absolute uncertainties\",\"Multiplying fractional uncertainties\"],\n    answer:1,\n    explain:\"For addition/subtraction the ABSOLUTE uncertainties add: Δz = Δx + Δy. Fractional uncertainties add for multiplication and division.\" },\n\n  { q:\"L₁ = (10.0 ± 0.2) cm and L₂ = (15.0 ± 0.3) cm. The total length L = L₁ + L₂ is:\",\n    options:[\"(25.0 ± 0.1) cm\",\"(25.0 ± 0.25) cm\",\"(25.0 ± 0.5) cm\",\"(25.0 ± 0.6) cm\"],\n    answer:2,\n    explain:\"Add the values: 10.0 + 15.0 = 25.0 cm. Add the absolute uncertainties: 0.2 + 0.3 = 0.5 cm. So L = (25.0 ± 0.5) cm.\" },\n\n  { q:\"Density ρ = m/V, with m = (50.0 ± 0.5) g and V = (25.0 ± 1.0) cm³. The result is:\",\n    options:[\"(2.0 ± 0.02) g/cm³\",\"(2.0 ± 0.05) g/cm³\",\"(2.0 ± 0.1) g/cm³\",\"(2.0 ± 0.5) g/cm³\"],\n    answer:2,\n    explain:\"ρ = 50.0/25.0 = 2.0 g/cm³. Δρ/ρ = 0.5/50.0 + 1.0/25.0 = 0.01 + 0.04 = 0.05. Δρ = 0.05 × 2.0 = 0.1. So ρ = (2.0 ± 0.1) g/cm³.\" }\n];\n\n/* ============================================================\n   TAB SWITCHING\n   ============================================================ */\ndocument.querySelectorAll('.tab').forEach(tab=>{\n  tab.addEventListener('click', ()=>{\n    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));\n    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));\n    tab.classList.add('active');\n    document.getElementById(tab.dataset.target).classList.add('active');\n  });\n});\n\n/* ============================================================\n   FLASHCARD ENGINE\n   ============================================================ */\nlet deck = CARDS.slice();\nlet ci = 0;\n\nconst cardEl   = document.getElementById('card');\nconst fcTerm   = document.getElementById('fcTerm');\nconst fcDef    = document.getElementById('fcDef');\nconst fcTagF   = document.getElementById('fcTagFront');\nconst fcTagB   = document.getElementById('fcTagBack');\nconst fcCount  = document.getElementById('fcCount');\nconst fcBar    = document.getElementById('fcBar');\nconst fcPrev   = document.getElementById('fcPrev');\nconst fcNext   = document.getElementById('fcNext');\n\nfunction renderCard(){\n  const c = deck[ci];\n  fcTerm.textContent = c.term;\n  fcDef.innerHTML    = c.def;\n  fcTagF.textContent = c.tag;\n  fcTagB.textContent = c.tag;\n  cardEl.classList.remove('flipped');\n  fcCount.textContent = (ci+1) + ' / ' + deck.length;\n  fcBar.style.width = ((ci+1)/deck.length*100) + '%';\n  fcPrev.disabled = ci === 0;\n  fcNext.disabled = ci === deck.length - 1;\n}\n\ncardEl.addEventListener('click', ()=> cardEl.classList.toggle('flipped'));\n\ndocument.getElementById('fcFlip').addEventListener('click', e=>{\n  e.stopPropagation();\n  cardEl.classList.toggle('flipped');\n});\nfcPrev.addEventListener('click', ()=>{ if(ci>0){ ci--; renderCard(); } });\nfcNext.addEventListener('click', ()=>{ if(ci\u003cdeck.length-1){ ci++; renderCard(); } });\n\ndocument.getElementById('fcShuffle').addEventListener('click', ()=>{\n  for(let i=deck.length-1;i>0;i--){\n    const j = Math.floor(Math.random()*(i+1));\n    [deck[i],deck[j]] = [deck[j],deck[i]];\n  }\n  ci = 0;\n  renderCard();\n});\n\n/* keyboard support */\ndocument.addEventListener('keydown', e=>{\n  if(!document.getElementById('flashcards').classList.contains('active')) return;\n  if(e.key === 'ArrowRight' && ci \u003c deck.length-1){ ci++; renderCard(); }\n  if(e.key === 'ArrowLeft'  && ci > 0){ ci--; renderCard(); }\n  if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); cardEl.classList.toggle('flipped'); }\n});\n\nrenderCard();\n\n/* ============================================================\n   QUIZ ENGINE\n   ============================================================ */\nconst quizBody = document.getElementById('quizBody');\nlet qi = 0, score = 0, locked = false, picks = [];\n\nfunction renderQuestion(){\n  locked = false;\n  const q = QUESTIONS[qi];\n\n  quizBody.innerHTML = `\n    \u003cdiv class=\"q-meta\">\n      \u003cspan>Question ${qi+1} of ${QUESTIONS.length}\u003c/span>\n      \u003cspan class=\"score-pill\">Score: ${score}\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"track\">\u003cspan style=\"width:${(qi/QUESTIONS.length)*100}%\">\u003c/span>\u003c/div>\n    \u003ch3 class=\"q-text\">${q.q}\u003c/h3>\n    \u003cdiv class=\"options\" id=\"options\">\u003c/div>\n    \u003cdiv class=\"feedback\" id=\"feedback\">\u003c/div>\n    \u003cbutton class=\"btn primary\" id=\"nextBtn\" style=\"display:none;\">\n      ${qi === QUESTIONS.length-1 ? 'See Results →' : 'Next Question →'}\n    \u003c/button>\n  `;\n\n  const optWrap = document.getElementById('options');\n  const letters = ['A','B','C','D'];\n\n  q.options.forEach((opt, i)=>{\n    const b = document.createElement('button');\n    b.className = 'option';\n    b.innerHTML = `\u003cspan class=\"letter\">${letters[i]}\u003c/span>\u003cspan>${opt}\u003c/span>`;\n    b.addEventListener('click', ()=> chooseAnswer(i, b));\n    optWrap.appendChild(b);\n  });\n\n  document.getElementById('nextBtn').addEventListener('click', ()=>{\n    if(qi === QUESTIONS.length - 1){ showResults(); }\n    else { qi++; renderQuestion(); }\n  });\n}\n\nfunction chooseAnswer(selected, btn){\n  if(locked) return;\n  locked = true;\n\n  const q = QUESTIONS[qi];\n  const buttons = document.querySelectorAll('#options .option');\n  const fb = document.getElementById('feedback');\n  const correct = selected === q.answer;\n\n  picks[qi] = selected;\n  if(correct) score++;\n\n  buttons.forEach((b, i)=>{\n    b.disabled = true;\n    if(i === q.answer) b.classList.add('correct');\n    else if(i === selected) b.classList.add('wrong');\n    else b.classList.add('dim');\n  });\n\n  fb.className = 'feedback show ' + (correct ? 'ok' : 'no');\n  fb.innerHTML = `\u003cspan class=\"verdict\">${correct ? '✔ Correct!' : '✘ Not quite'}\u003c/span>${q.explain}`;\n\n  const scorePill = document.querySelector('.score-pill');\n  if(scorePill) scorePill.textContent = 'Score: ' + score;\n\n  document.getElementById('nextBtn').style.display = 'block';\n}\n\nfunction showResults(){\n  const total = QUESTIONS.length;\n  const pct = Math.round((score/total)*100);\n\n  let msg = '';\n  if(pct >= 90)      msg = \"Outstanding! You've mastered physical quantities. 🏆\";\n  else if(pct >= 75) msg = \"Excellent work — just polish a few details. ⭐\";\n  else if(pct >= 60) msg = \"Good effort. Review the flashcards and try again. 📘\";\n  else if(pct >= 40) msg = \"You're getting there — revisit vectors and uncertainty. 🔁\";\n  else               msg = \"Don't worry! Work through the flashcards first, then retry. 💪\";\n\n  let reviewHTML = '';\n  QUESTIONS.forEach((q, i)=>{\n    const user = picks[i];\n    const ok = user === q.answer;\n    const letters = ['A','B','C','D'];\n    reviewHTML += `\n      \u003cdiv class=\"review-item ${ok ? 'ok' : ''}\">\n        \u003cdiv class=\"review-q\">${i+1}. ${q.q}\u003c/div>\n        \u003cdiv class=\"review-a\">\n          Correct answer: \u003cb>${letters[q.answer]}. ${q.options[q.answer]}\u003c/b>\u003cbr>\n          ${ok ? '' : `Your answer: \u003ci>${user !== undefined ? letters[user] + '. ' + q.options[user] : 'Not answered'}\u003c/i>\u003cbr>`}\n          ${q.explain}\n        \u003c/div>\n      \u003c/div>\n    `;\n  });\n\n  quizBody.innerHTML = `\n    \u003cdiv class=\"result-hero\">\n      \u003cdiv style=\"font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:800;\">\n        Your Result\n      \u003c/div>\n      \u003cdiv class=\"result-score\">${score} / ${total}\u003c/div>\n      \u003cdiv style=\"font-size:1.1rem;font-weight:800;color:var(--gold);\">${pct}%\u003c/div>\n      \u003cp class=\"result-msg\">${msg}\u003c/p>\n      \u003cbutton class=\"btn gold\" id=\"retryBtn\" style=\"margin-top:20px;padding:14px 26px;\">\n        🔄 Retake Quiz\n      \u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"review-title\">Answer Review\u003c/div>\n    ${reviewHTML}\n  `;\n\n  document.getElementById('retryBtn').addEventListener('click', ()=>{\n    qi = 0; score = 0; picks = [];\n    renderQuestion();\n  });\n\n  window.scrollTo({ top: 0, behavior: 'smooth' });\n}\n\nrenderQuestion();\n\u003c/script>\n\u003c/body>\n\u003c/html>"}]}]}</script>
<script id="meta" type="application/json">{"site":{"name":"Gold'N Geniuz Learning Hub","logo":"🎓","subtitle":"Quizzes, flashcards and resources — all in one place."},"types":{"quiz":{"label":"Quiz","icon":"📝","color":"#f59e0b","plural":"Quizzes"},"flashcard":{"label":"Flashcards","icon":"🃏","color":"#10b981","plural":"Flashcards"},"resource":{"label":"Resource","icon":"📚","color":"#3b82f6","plural":"Resources"}}}</script>
<script>
(function(){
'use strict';

var DB    = JSON.parse(document.getElementById('data').textContent);
var META  = JSON.parse(document.getElementById('meta').textContent);
var SITE  = META.site;
var TYPES = META.types;

var app           = document.getElementById('app');
var viewerEl      = document.getElementById('viewer');
var viewerBody    = document.getElementById('viewerBody');
var viewerTitleEl = document.getElementById('viewerTitle');
var viewerDoneBtn = document.getElementById('viewerDone');
var viewerOpenEl  = document.getElementById('viewerOpen');
var searchInput   = document.getElementById('searchInput');
var themeBtn      = document.getElementById('themeBtn');

var DONE_KEY  = 'studentHub.done.v1';
var THEME_KEY = 'studentHub.theme.v1';

var query = '';
var lastFilter = 'all';
var currentBlob = null;
var viewerCtx = null;

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function getGrade(id){
  for (var i = 0; i < DB.grades.length; i++)
    if (DB.grades[i].id === id) return DB.grades[i];
  return null;
}
function getDoneSet(){
  try { return new Set(JSON.parse(localStorage.getItem(DONE_KEY) || '[]')); }
  catch(e){ return new Set(); }
}
function isDone(gid, item){ return getDoneSet().has(gid + ':' + item.id); }
function toggleDone(gid, item){
  var s = getDoneSet();
  var k = gid + ':' + item.id;
  if (s.has(k)) s.delete(k); else s.add(k);
  localStorage.setItem(DONE_KEY, JSON.stringify(Array.from(s)));
  return s.has(k);
}
function countOf(g, t){
  var n = 0;
  for (var i = 0; i < g.items.length; i++) if (g.items[i].type === t) n++;
  return n;
}
function parseHash(){
  var parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (parts[0] === 'grade' && parts[1])
    return { view:'grade', gradeId:parts[1], filter:parts[2] || 'all' };
  if (parts[0] === 'view' && parts[1] && parts[2] !== undefined)
    return { view:'view', gradeId:parts[1], index:+parts[2] };
  return { view:'home' };
}

function renderHome(){
  var q = query.trim().toLowerCase();
  if (q){ app.innerHTML = renderSearch(q); return; }

  var h = '';
  h += '<section class="hero">';
  h +=   '<h1>Choose your grade</h1>';
  h +=   '<p>' + esc(SITE.subtitle || '') + '</p>';
  h += '</section>';

  if (!DB.grades.length){
    h += '<div class="empty"><span class="big">📭</span>No content has been added yet.</div>';
    app.innerHTML = h;
    return;
  }
  h += '<div class="grade-grid">';
  for (var i = 0; i < DB.grades.length; i++) h += gradeCard(DB.grades[i]);
  h += '</div>';
  app.innerHTML = h;
}

function gradeCard(g){
  var total = g.items.length;
  var done = 0;
  for (var i = 0; i < g.items.length; i++)
    if (isDone(g.id, g.items[i])) done++;
  var pct = total ? Math.round(done / total * 100) : 0;
  var color = esc(g.color || '#4f46e5');
  var h = '';
  h += '<a class="grade-card" href="#/grade/' + esc(g.id) + '/all" style="--c:' + color + '">';
  h +=   '<div class="grade-emoji">' + esc(g.emoji || '📘') + '</div>';
  h +=   '<div class="grade-name">' + esc(g.name) + '</div>';
  h +=   '<div class="grade-blurb">' + esc(g.blurb || '') + '</div>';
  h +=   '<div class="counts">' + countOf(g,'quiz') + ' quizzes · ' +
                              countOf(g,'flashcard') + ' flashcards · ' +
                              countOf(g,'resource') + ' resources</div>';
  h +=   '<div class="bar"><span style="width:' + pct + '%"></span></div>';
  h += '</a>';
  return h;
}

function renderSearch(q){
  var results = [];
  for (var i = 0; i < DB.grades.length; i++){
    var g = DB.grades[i];
    for (var j = 0; j < g.items.length; j++){
      var it = g.items[j];
      var hay = (it.title + ' ' + (it.desc || '') + ' ' + (it.tags || []).join(' ') + ' ' + g.name + ' ' + it.type).toLowerCase();
      if (hay.indexOf(q) !== -1) results.push({ g: g, it: it });
    }
  }
  if (!results.length){
    return '<div class="empty"><span class="big">🔍</span>No results for "' + esc(q) +
           '".<br>Try another word, or <a href="#/" style="color:var(--accent)">browse by grade</a>.</div>';
  }
  var h = '';
  h += '<a class="back" href="#/">← All grades</a>';
  h += '<section class="hero"><h1>' + results.length + ' result' + (results.length > 1 ? 's' : '') + '</h1>';
  h += '<p>for "' + esc(q) + '"</p></section>';
  h += '<div class="item-grid">';
  for (var k = 0; k < results.length; k++) h += itemCard(results[k].g, results[k].it);
  h += '</div>';
  return h;
}

function renderGrade(gid, filter){
  var g = getGrade(gid);
  if (!g){ location.hash = '#/'; return; }

  var total = g.items.length;
  var done = 0;
  for (var i = 0; i < total; i++) if (isDone(g.id, g.items[i])) done++;
  var pct = total ? Math.round(done / total * 100) : 0;
  var color = esc(g.color || '#4f46e5');

  var h = '';
  h += '<a class="back" href="#/">← All grades</a>';
  h += '<div class="grade-head" style="--c:' + color + '">';
  h +=   '<div class="dot">' + esc(g.emoji || '📘') + '</div>';
  h +=   '<div><h1>' + esc(g.name) + '</h1>';
  h +=   '<small>' + done + ' of ' + total + ' completed · ' + pct + '%</small></div>';
  h += '</div>';
  h += '<div class="bar" style="--c:' + color + ';max-width:420px"><span style="width:' + pct + '%"></span></div>';

  var tabs = [{ key:'all', label:'All', n: total }];
  for (var t in TYPES) tabs.push({ key:t, label:TYPES[t].plural, n: countOf(g, t) });

  h += '<nav class="tabs">';
  for (var i2 = 0; i2 < tabs.length; i2++){
    var tb = tabs[i2];
    h += '<a class="tab ' + (tb.key === filter ? 'active' : '') + '" href="#/grade/' + esc(g.id) + '/' + tb.key + '">';
    h += tb.label + ' (' + tb.n + ')';
    h += '</a>';
  }
  h += '</nav>';

  var list = [];
  for (var j = 0; j < g.items.length; j++)
    if (filter === 'all' || g.items[j].type === filter) list.push(g.items[j]);

  if (list.length){
    h += '<div class="item-grid">';
    for (var k = 0; k < list.length; k++) h += itemCard(g, list[k]);
    h += '</div>';
  } else {
    h += '<div class="empty"><span class="big">📭</span>Nothing here yet.</div>';
  }
  app.innerHTML = h;
}

function itemCard(g, it){
  var t = TYPES[it.type] || TYPES.resource;
  var idx = g.items.indexOf(it);
  var done = isDone(g.id, it);
  var h = '';
  h += '<a class="item" href="#/view/' + esc(g.id) + '/' + idx + '" style="--t:' + t.color + '">';
  h +=   '<div class="ticon">' + t.icon + '</div>';
  h +=   '<div style="min-width:0">';
  h +=     '<h3>' + esc(it.title) + '</h3>';
  h +=     '<p>' + esc(it.desc || t.label) + '</p>';
  h +=     '<div class="tags">';
  for (var i = 0; i < (it.tags || []).length; i++)
    h += '<span class="tag">' + esc(it.tags[i]) + '</span>';
  h +=       '<span class="tag">' + esc(g.name) + '</span>';
  h +=     '</div>';
  if (done) h += '<span class="done-badge">✓ Completed</span>';
  h +=   '</div>';
  h += '</a>';
  return h;
}

function showViewer(g, item){
  viewerCtx = { g: g, item: item };
  viewerTitleEl.textContent = item.title;

  if (currentBlob){ URL.revokeObjectURL(currentBlob); currentBlob = null; }

  var src = item.url || '';
  if (item.html){
    currentBlob = URL.createObjectURL(new Blob([item.html], { type: 'text/html' }));
    src = currentBlob;
  }
  if (src){
    viewerBody.innerHTML = '<iframe src="' + src + '" allow="fullscreen; autoplay"></iframe>';
    viewerOpenEl.style.display = '';
    viewerOpenEl.href = src;
  } else {
    viewerBody.innerHTML = '<div class="missing"><div>' +
      '<div style="font-size:40px">' + ((TYPES[item.type] || TYPES.resource).icon) + '</div>' +
      '<h3 style="margin:12px 0 6px">No content linked</h3>' +
      '<p>This item has no file yet.</p></div></div>';
    viewerOpenEl.style.display = 'none';
  }
  updateDoneBtn();
  viewerEl.hidden = false;
  document.body.style.overflow = 'hidden';
}
function hideViewer(){
  viewerEl.hidden = true;
  viewerBody.innerHTML = '';
  document.body.style.overflow = '';
  viewerCtx = null;
  if (currentBlob){ URL.revokeObjectURL(currentBlob); currentBlob = null; }
}
function updateDoneBtn(){
  if (!viewerCtx) return;
  var d = isDone(viewerCtx.g.id, viewerCtx.item);
  viewerDoneBtn.classList.toggle('on', d);
  viewerDoneBtn.textContent = d ? '✓ Completed' : 'Mark complete';
}

function render(){
  var r = parseHash();
  if (r.view === 'grade'){
    lastFilter = r.filter;
    renderGrade(r.gradeId, r.filter);
    hideViewer();
  } else if (r.view === 'view'){
    var g = getGrade(r.gradeId);
    var item = g && g.items[r.index];
    if (g && item){
      renderGrade(g.id, lastFilter);
      showViewer(g, item);
    } else {
      location.hash = '#/';
      return;
    }
  } else {
    renderHome();
    hideViewer();
  }
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', render);

document.getElementById('viewerClose').addEventListener('click', function(){
  if (viewerCtx) location.hash = '#/grade/' + viewerCtx.g.id + '/' + lastFilter;
  else location.hash = '#/';
});
document.getElementById('viewerBack').addEventListener('click', function(){
  if (viewerCtx) location.hash = '#/grade/' + viewerCtx.g.id + '/' + lastFilter;
  else location.hash = '#/';
});
viewerDoneBtn.addEventListener('click', function(){
  if (!viewerCtx) return;
  toggleDone(viewerCtx.g.id, viewerCtx.item);
  updateDoneBtn();
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && !viewerEl.hidden && viewerCtx)
    location.hash = '#/grade/' + viewerCtx.g.id + '/' + lastFilter;
});

searchInput.addEventListener('input', function(e){
  query = e.target.value;
  if (parseHash().view === 'home') renderHome();
  else location.hash = '#/';
});

var savedTheme = localStorage.getItem(THEME_KEY) || 'light';
document.documentElement.dataset.theme = savedTheme;
themeBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
themeBtn.addEventListener('click', function(){
  var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
  localStorage.setItem(THEME_KEY, next);
});

document.title = SITE.name;
render();

})();
</script>
</body>
</html>
