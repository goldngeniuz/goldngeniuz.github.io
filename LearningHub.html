<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold&#39;N Geniuz Learning Hub</title>
<style>
:root{
  --bg:#f5f7fb; --surface:#ffffff; --surface-2:#eef2f9;
  --text:#0f172a; --muted:#64748b; --border:#e3e8f0;
  --accent:#4f46e5; --radius:16px;
  --shadow:0 1px 2px rgba(15,23,42,.05), 0 10px 30px rgba(15,23,42,.06);
  --ok:#16a34a;
}
html[data-theme="dark"]{
  --bg:#0a0f1e; --surface:#131a2c; --surface-2:#1b2438;
  --text:#e9eefb; --muted:#93a1bd; --border:#232e48;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
input{font:inherit;color:inherit}

.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
  padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;white-space:nowrap}
.brand .logo{font-size:22px}
.search{flex:1;max-width:440px;margin-left:auto;position:relative}
.search input{
  width:100%;padding:10px 14px 10px 36px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text);font-size:14px;outline:none;
}
.search input:focus{border-color:var(--accent)}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.55;font-size:14px}
.icon-btn{
  border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  border-radius:10px;padding:8px 12px;font-size:14px;
}
.icon-btn:hover{border-color:var(--accent)}

.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 80px}
.hero h1{margin:0 0 6px;font-size:clamp(24px,4vw,36px);letter-spacing:-.02em}
.hero p{margin:0 0 26px;color:var(--muted);font-size:15px}

.grade-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.grade-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  transition:transform .15s ease, border-color .15s ease;
}
.grade-card:hover{transform:translateY(-3px);border-color:var(--c)}
.grade-card::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.grade-emoji{font-size:26px}
.grade-name{font-weight:800;font-size:18px;margin-top:8px}
.grade-blurb{color:var(--muted);font-size:13px;margin-top:2px;min-height:18px}
.counts{color:var(--muted);font-size:12.5px;margin-top:12px}
.bar{height:6px;border-radius:99px;background:var(--surface-2);margin-top:12px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px;transition:width .3s}

.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;margin-bottom:14px}
.back:hover{color:var(--accent)}
.grade-head{display:flex;align-items:center;gap:14px;margin-bottom:8px;flex-wrap:wrap}
.grade-head .dot{width:44px;height:44px;border-radius:14px;background:var(--c);display:grid;place-items:center;font-size:22px}
.grade-head h1{margin:0;font-size:clamp(22px,3.4vw,30px);letter-spacing:-.02em}
.grade-head small{display:block;color:var(--muted);font-weight:500;font-size:13px;margin-top:2px}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 22px}
.tab{
  padding:8px 14px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface);font-size:14px;color:var(--muted);
}
.tab:hover{border-color:var(--accent)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

.item-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.item{
  display:flex;gap:14px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);
  transition:transform .15s ease,border-color .15s ease;
}
.item:hover{transform:translateY(-2px);border-color:var(--t)}
.item .ticon{
  flex:0 0 42px;height:42px;border-radius:12px;display:grid;place-items:center;
  font-size:20px;background:color-mix(in srgb, var(--t) 16%, transparent);
}
.item h3{margin:0 0 4px;font-size:15.5px;font-weight:700}
.item p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:11.5px;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.done-badge{font-size:11.5px;color:var(--ok);font-weight:700;margin-top:10px;display:block}

.empty{
  text-align:center;padding:60px 20px;color:var(--muted);
  background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);
}
.empty .big{font-size:34px;display:block;margin-bottom:10px}

.viewer{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column}
.viewer[hidden]{display:none}
.viewer-bar{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;
}
.viewer-title{font-weight:700;font-size:15px;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{
  border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  border-radius:999px;padding:7px 13px;font-size:13px;
}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.viewer-body{flex:1;background:var(--surface-2);position:relative}
.viewer-body iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.missing{height:100%;display:grid;place-items:center;text-align:center;padding:30px;color:var(--muted)}

@media (max-width:640px){
  .topbar{flex-wrap:wrap}
  .search{max-width:none;order:3;width:100%;margin-left:0}
  .wrap{padding:20px 14px 60px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="logo">🎓</span><span>Gold&#39;N Geniuz Learning Hub</span></div>
  <div class="search">
    <span class="ico">🔍</span>
    <input id="searchInput" type="search" placeholder="Search quizzes, flashcards, resources..." autocomplete="off">
  </div>
  <button class="icon-btn" id="themeBtn" title="Toggle theme">🌙</button>
</header>

<main class="wrap" id="app"></main>

<div class="viewer" id="viewer" hidden>
  <div class="viewer-bar">
    <button class="icon-btn" id="viewerBack">← Back</button>
    <div class="viewer-title" id="viewerTitle"></div>
    <div class="viewer-actions">
      <button class="chip" id="viewerDone">Mark complete</button>
      <a class="chip" id="viewerOpen" target="_blank" rel="noopener">Open ↗</a>
      <button class="icon-btn" id="viewerClose">✕</button>
    </div>
  </div>
  <div class="viewer-body" id="viewerBody"></div>
</div>

  }\n  .hero::before{\n    content:\"\";position:absolute;inset:0;\n    background:radial-gradient(600px 200px at 50% -40%, rgba(245,200,66,.14), transparent 70%);\n    pointer-events:none;\n  }\n  .brand{\n    font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;\n    color:var(--gold);font-weight:700;margin-bottom:10px;\n  }\n  .hero h1{\n    margin:0;font-size:clamp(1.9rem,6vw,2.9rem);letter-spacing:.06em;\n    background:linear-gradient(90deg,var(--teal),var(--blue) 55%,var(--gold));\n    -webkit-background-clip:text;background-clip:text;color:transparent;\n    font-weight:800;\n  }\n  .issue{margin:8px 0 4px;font-size:.9rem;color:var(--txt);font-weight:600;}\n  .sub{margin:0;font-size:.78rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}\n\n  /* ---------- TABS ---------- */\n  .tabs{display:flex;gap:10px;margin:20px 0 16px;}\n  .tab{\n    flex:1;padding:13px 10px;border-radius:14px;cursor:pointer;\n    background:var(--panel);border:1px solid var(--line);\n    color:var(--muted);font-size:.92rem;font-weight:700;letter-spacing:.03em;\n    transition:.2s;font-family:inherit;\n  }\n  .tab:hover{border-color:var(--teal);color:var(--txt);}\n  .tab.active{\n    background:linear-gradient(135deg, rgba(45,212,191,.18), rgba(96,165,250,.18));\n    border-color:var(--teal);color:#fff;\n    box-shadow:0 0 0 1px rgba(45,212,191,.35), 0 8px 24px -12px rgba(45,212,191,.6);\n  }\n  .panel{display:none;animation:fade .35s ease;}\n  .panel.active{display:block;}\n  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}\n\n  /* ---------- FLASHCARDS ---------- */\n  .fc-bar{\n    display:flex;justify-content:space-between;align-items:center;\n    font-size:.8rem;color:var(--muted);margin-bottom:10px;font-weight:600;\n    letter-spacing:.06em;\n  }\n  .track{height:6px;background:#16233a;border-radius:99px;overflow:hidden;margin-bottom:18px;}\n  .track > span{\n    display:block;height:100%;width:0;\n    background:l ily:inherit;letter-spacing:.02em;\n  }\n  .btn:hover:not(:disabled){border-color:var(--teal);background:#1c2c46;transform:translateY(-1px);}\n  .btn:disabled{opacity:.35;cursor:not-allowed;}\n  .btn.primary{\n    background:linear-gradient(135deg,var(--teal),#22a3c4);\n    color:#062018;border-color:transparent;\n  }\n  .btn.primary:hover{filter:brightness(1.08);}\n  .btn.gold{\n    background:linear-gradient(135deg,var(--gold),#e0a92a);\n    color:#2a1e00;border-color:transparent;\n  }\n\n  /* ---------- QUIZ ---------- */\n  .q-meta{\n    display:flex;justify-content:space-between;align-items:center;\n    font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;\n    color:var(--muted);margin-bottom:10px;\n  }\n  .score-pill{\n    background:rgba(245,200,66,.13);color:var(--gold);\n    border:1px solid rgba(245,200,66,.35);\n    padding:4px 11px;border-radius:99px;font-size:.7rem;\n  }\n  .q-text{\n    font-size:clamp(1.02rem,3.4vw,1.2rem);line-height:1.55;font-weight:700;\n    margin:20px 0 18px;\n  }\n  .options{display:flex;flex-direction:column;gap:10px;}\n  .option{\n    text-align:left;padding:14px 16px;border-radius:13px;\n    background:var(--panel2);border:1.5px solid var(--line);color:var(--txt);\n    font-size:.93rem;line-height:1.45;cursor:pointer;transition:.16s;\n    font-family:inherit;display:flex;gap:12px;align-items:flex-start;\n  }\n  .option .letter{\n    flex:0 0 24px;height:24px;border-radius:7px;\n    background:#0d1728;border:1px solid var(--line);\n    display:flex;align-items:center;justify-content:center;\n    font-size:.72rem;font-weight:800;color:var(--muted);\n  }\n  .option:hover:not(:disabled){border-color:var(--blue);background:#1b2a44;transform:translateX(3px);}\n  .option:disabled{cursor:default;}\n  .option.correct{\n    border-color:var(--green);background:rgba(52,211,153,.13);\n  }\n  .option.correct .letter{background:var(--green);color:#04231a;border-color:transparent;}\n  .option.wrong{\n    border-color:var(--red);background:rgba(248,113,113,.13);\n  }\n  .option.wrong .letter{background:var(--red);color:#2b0505;border-color:transparent;}\n  .option.dim{opacity:.5;}\n\n  .feedback{\n    margin-top:16px;padding:15px 17px;border-radius:13px;\n    border-left:4px solid var(--blue);background:#111d31;\n    font-size:.88rem;line-height:1.6;color:#cfdcf1;display:none;\n  }\n  .feedback.show{display:block;animation:fade .3s ease;}\n  .feedback .verdict{font-weight:800;display:block;margin-bottom:6px;letter-spacing:.05em;}\n  .feedback.ok{border-left-color:var(--green);}\n  .feedback.ok .verdict{color:var(--green);}\n  .feedback.no{border-left-color:var(--red);}\n  .feedback.no .verdict{color:var(--red);}\n\n  #nextBtn{margin-top:16px;width:100%;}\n\n  /* ---------- RESULTS ---------- */\n  .result-hero{\n    text-align:center;padding:34px 22px;border-radius:20px;\n    border:1px solid var(--line);\n    background:linear-gradient(160deg,#13233a,#0c1524);\n  }\n  .result-score{\n    font-size:clamp(2.6rem,12vw,4rem);font-weight:900;line-height:1;margin:6px 0;\n    background:linear-gradient(90deg,var(--teal),var(--gold));\n    -webkit-background-clip:text;background-clip:text;color:transparent;\n  }\n  .result-msg{color:var(--muted);font-size:.95rem;margin:10px 0 0;}\n  .review-title{\n    margin:28px 0 12px;font-size:.78rem;letter-spacing:.18em;\n    text-transform:uppercase;color:var(--muted);font-weight:800;\n  }\n  .review-item{\n    background:var(--panel);border:1px solid var(--line);\n    border-radius:14px;padding:15px 16px;margin-bottom:10px;\n    border-left:4px solid var(--red);\n  }\n  .review-item.ok{border-left-color:var(--green);}\n  .review-q{font-size:.88rem;font-weight:700;line-height:1.5;margin-bottom:8px;}\n  .review-a{font-size:.8rem;line-height:1.6;color:var(--muted);}\n  .review-a b{color:var(--green);}\n  .review-a i{color:var(--red);font-style:normal;}\n\n  footer{\n    text-align:center;margin-top:36px;font-size:.7rem;color:#5b6d8a;\n    letter-spacing:.1em;text-transform:uppercase;line-height:1.9;\n  }\n\n  @media(max-width:520px){\n    .card{height:395px;}\n    .face{padding:22px 18px;}\n    .fc-controls{grid-template-columns:1fr 1fr;}\n    .fc-controls .btn.gold{grid-column:span 2;}\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"app\">\n\n  \u003cheader class=\"hero\">\n    \u003cdiv class=\"brand\">Gold'n Geniuz Online Tutoring Services\u003c/div>\n    \u003ch1>Au-CHIVES\u003c/h1>\n    \u003cp class=\"issue\">VOL 01 · ISS #1 — MECHANICS: Measurements\u003c/p>\n    \u003cp class=\"sub\">Interactive Revision · Flashcards &amp; Quiz\u003c/p>\n  \u003c/header>\n\n  \u003cnav class=\"tabs\">\n    \u003cbutton class=\"tab active\" data-target=\"flashcards\">🃏 Flashcards\u003c/button>\n    \u003cbutton class=\"tab\" data-target=\"quiz\">📝 Quiz\u003c/button>\n  \u003c/nav>\n\n  \u003c!-- ============ FLASHCARDS ============ -->\n  \u003csection id=\"flashcards\" class=\"panel active\">\n    \u003cdiv class=\"fc-bar\">\n      \u003cspan id=\"fcCount\">1 / 20\u003c/span>\n      \u003cspan>Tap card to flip\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"track\">\u003cspan id=\"fcBar\">\u003c/span>\u003c/div>\n\n    \u003cdiv class=\"card\" id=\"card\">\n      \u003cdiv class=\"card-inner\">\n        \u003cdiv class=\"face front\">\n          \u003cdiv class=\"pill\" id=\"fcTagFront\">KEY TERM\u003c/div>\n          \u003ch2 class=\"term\" id=\"fcTerm\">—\u003c/h2>\n          \u003cp class=\"hint\">Tap to reveal\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"face back\">\n          \u003cdiv class=\"pill\" id=\"fcTagBack\">DEFINITION\u003c/div>\n          \u003cp class=\"def\" id=\"fcDef\">—\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"fc-controls\">\n      \u003cbutton class=\"btn\" id=\"fcPrev\">← Prev\u003c/button>\n      \u003cbutton class=\"btn primary\" id=\"fcFlip\">Flip\u003c/button>\n      \u003cbutton class=\"btn\" id=\"fcNext\">Next →\u003c/button>\n      \u003cbutton class=\"btn gold\" id=\"fcShuffle\" style=\"grid-column:1/-1\">🔀 Shuffle Deck\u003c/button>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- ============ QUIZ ============ -->\n  \u003csection id=\"quiz\" class=\"panel\">\n    \u003cdiv id=\"quizBody\">\u003c/div>\n  \u003c/section>\n\n  \u003cfooter>\n    Au-CHIVES · The Students Workbook for Physics\u003cbr>\n    © Gold'n Geniuz Online Tutoring Services — Kingston, Jamaica\n  \u003c/footer>\n\u003c/div>\n\n\u003cscript>\n/* ============================================================\n   VOCABULARY — 20 KEY CSEC PHYSICS TERMS\n   ============================================================ */\nconst CARDS = [\n  { term:\"Scientific Method\", tag:\"Methodology\",\n    def:\"An evidence-based approach to investigating the physical world: careful observation → controlled experimentation → mathematical description → reproducible results. Pioneered by Galileo, it replaced pure philosophical reasoning.\" },\n\n  { term:\"Empirical Evidence\", tag:\"Methodology\",\n    def:\"Information gained from direct observation and measurement of real phenomena rather than from logic or authority alone. Galileo insisted that physical laws must rest on empirical evidence.\" },\n\n  { term:\"Simple Pendulum\", tag:\"Pendulum\",\n    def:\"A small mass (the bob) suspended from a fixed point by a light, inextensible string of negligible mass, free to swing to and fro about its equilibrium position.\" },\n\n  { term:\"Bob\", tag:\"Pendulum\",\n    def:\"The concentrated mass at the end of a pendulum string. Its mass does NOT affect the period of the pendulum.\" },\n\n  { term:\"Period (T)\", tag:\"Pendulum\",\n    def:\"The time taken for one complete oscillation (a full to-and-fro swing). Measured in seconds (s). For a simple pendulum: T = 2π√(L/g).\" },\n\n  { term:\"Amplitude\", tag:\"Pendulum\",\n    def:\"The maximum displacement of the pendulum from its equilibrium position. For small angles it does not significantly affect the period.\" },\n\n  { term:\"Oscillation\", tag:\"Pendulum\",\n    def:\"One complete to-and-fro cycle of a vibrating body. Timing several (e.g. 10) oscillations and dividing reduces random error in timing.\" },\n\n  { term:\"Equilibrium Position\", tag:\"Pendulum\",\n    def:\"The rest position of the pendulum when hanging vertically. Displacement and amplitude are measured from this position.\" },\n\n  { term:\"Gravitational Field Strength (g)\", tag:\"Pendulum\",\n    def:\"The force per unit mass acting due to gravity; on Earth ≈ 9.8 N/kg (9.8 m/s²). It affects the pendulum's period through T = 2π√(L/g).\" },\n\n  { term:\"Controlled Variables\", tag:\"Experiment Design\",\n    def:\"All the factors kept constant during an experiment so that only the independent variable can affect the results. E.g. keeping bob mass and amplitude fixed while changing length.\" },\n\n  { term:\"Gradient\", tag:\"Graphing\",\n    def:\"The slope of a straight-line graph, calculated as Δy/Δx. For a T² vs L graph the gradient = 4π²/g, allowing g to be determined experimentally.\" },\n\n  { term:\"Line of Best Fit\", tag:\"Graphing\",\n    def:\"A single smooth straight line drawn through plotted points so that roughly equal numbers lie above and below it. Outliers are ignored and the line need not pass through the origin unless theory predicts it.\" },\n\n  { term:\"Random Error\", tag:\"Errors\",\n    def:\"Unpredictable variation of readings about the true value, caused by reaction time, parallax or fluctuating conditions. It reduces precision but can be reduced by taking repeated readings and averaging.\" },\n\n  { term:\"Systematic Error\", tag:\"Errors\",\n    def:\"A consistent shift of all readings in one direction away from the true value, caused by faulty or uncalibrated instruments, poor technique or environmental conditions. It affects accuracy and CANNOT be removed by averaging.\" },\n\n  { term:\"Accuracy\", tag:\"Errors\",\n    def:\"How close a measurement is to the true (accepted) value. Accuracy is affected by systematic errors and can be improved by calibrating the instrument.\" },\n\n  { term:\"Precision\", tag:\"Errors\",\n    def:\"How close repeated measurements are to each other — the consistency of readings. Precision is affected by random errors and improved by averaging repeats.\" },\n\n  { term:\"Sensitivity\", tag:\"Instruments\",\n    def:\"The smallest change in the quantity being measured that an instrument can detect. A micrometer screw gauge has a sensitivity of 0.01 mm; a meter rule, 1 mm.\" },\n\n  { term:\"Range\", tag:\"Instruments\",\n    def:\"The smallest and largest values an instrument is able to measure. The chosen instrument's range must cover all the values expected in the experiment.\" },\n\n  { term:\"Significant Figures\", tag:\"Measurement\",\n    def:\"The digits in a measurement that indicate its precision. Multiplication/division → round to the least number of significant figures; addition/subtraction → round to the least number of decimal places.\" },\n\n  { term:\"Density (ρ)\", tag:\"Density\",\n    def:\"Mass per unit volume: ρ = m/V. SI units are kg/m³ (or g/cm³). 1 g/cm³ = 1000 kg/m³. Water ≈ 1 g/cm³. Irregular solids are measured by water displacement.\" }\n];\n\n/* ============================================================\n   QUIZ — 20 QUESTIONS\n   ============================================================ */\nconst QUESTIONS = [\n  { q:\"The period of a simple pendulum depends on which two quantities?\",\n    options:[\"Mass of the bob and amplitude\",\"Length and gravitational field strength\",\"Mass of the bob and length\",\"Amplitude and gravitational field strength\"],\n    answer:1,\n    explain:\"T = 2π√(L/g). For small angles the period depends only on the length L and the gravitational field strength g.\" },\n\n  { q:\"Which factor has NO significant effect on the period of a simple pendulum swinging through a small angle?\",\n    options:[\"Length of the string\",\"Gravitational field strength\",\"Mass of the bob\",\"None — all of them affect it\"],\n    answer:2,\n    explain:\"Mass does not appear in T = 2π√(L/g), so a heavier bob swings with exactly the same period as a lighter one.\" },\n\n  { q:\"Which is the correct formula for the period of a simple pendulum at small amplitude?\",\n    options:[\"T = 2π√(g/L)\",\"T = 2π√(L/g)\",\"T = 2π(L/g)\",\"T = √(2πL/g)\"],\n    answer:1,\n    explain:\"T = 2π√(L/g) — period increases with length and decreases as g increases.\" },\n\n  { q:\"To reduce random error when timing a pendulum, the best technique is to:\",\n    options:[\"Time only one oscillation very carefully\",\"Time 10 complete oscillations and divide the total by 10\",\"Use a heavier bob\",\"Increase the amplitude to 45°\"],\n    answer:1,\n    explain:\"Timing many oscillations and dividing spreads the human reaction-time error over a longer interval, reducing the percentage error.\" },\n\n  { q:\"A student plots T² against L and obtains a straight line. The gradient of this line equals:\",\n    options:[\"g / 4π²\",\"4π² / g\",\"2π / g\",\"g / 2π\"],\n    answer:1,\n    explain:\"From T² = (4π²/g) × L, the gradient is 4π²/g. Rearranging gives g = 4π² / gradient.\" },\n\n  { q:\"A T² vs L graph has a gradient of 4.1 s²/m. Using g = 4π² / gradient, the experimental value of g is approximately:\",\n    options:[\"4.1 m/s²\",\"9.6 m/s²\",\"19.7 m/s²\",\"1.0 m/s²\"],\n    answer:1,\n    explain:\"g = 4π² / 4.1 = 39.48 / 4.1 ≈ 9.6 m/s² — close to the accepted 9.8 m/s².\" },\n\n  { q:\"In a graph of T² (y-axis) against L (x-axis), which quantity is the independent variable?\",\n    options:[\"T², because it is measured\",\"L, because the student changes it\",\"g, because it is constant\",\"Neither — the axes can be swapped freely\"],\n    answer:1,\n    explain:\"The independent variable (what you deliberately change) always goes on the x-axis; the dependent variable (what you measure) goes on the y-axis.\" },\n\n  { q:\"Which of the following is an example of a SYSTEMATIC error?\",\n    options:[\"A ruler with a worn zero mark\",\"Reaction time when starting a stopwatch\",\"Small fluctuations in room temperature\",\"Parallax when reading a scale\"],\n    answer:0,\n    explain:\"A worn zero mark shifts every reading consistently in the same direction — a classic systematic (zero) error.\" },\n\n  { q:\"Which type of error CANNOT be reduced by taking repeated readings and averaging?\",\n    options:[\"Random error\",\"Systematic error\",\"Parallax error\",\"Reaction-time error\"],\n    answer:1,\n    explain:\"Averaging cancels random scatter but a systematic shift affects every reading equally, so the average stays wrong. Instruments must be calibrated instead.\" },\n\n  { q:\"Random errors mainly affect ______ while systematic errors mainly affect ______.\",\n    options:[\"accuracy; precision\",\"precision; accuracy\",\"range; sensitivity\",\"sensitivity; range\"],\n    answer:1,\n    explain:\"Random errors scatter readings → poor precision. Systematic errors shift all readings → poor accuracy.\" },\n\n  { q:\"The sensitivity of a measuring instrument is:\",\n    options:[\"The largest value it can measure\",\"How close a reading is to the true value\",\"The smallest change in the quantity it can detect\",\"How consistent repeated readings are\"],\n    answer:2,\n    explain:\"Sensitivity = the smallest detectable change. E.g. micrometer screw gauge = 0.01 mm, vernier calipers = 0.1 mm, meter rule = 1 mm.\" },\n\n  { q:\"You must measure the diameter of a wire that is approximately 0.8 mm thick. The most suitable instrument is:\",\n    options:[\"A meter rule (sensitivity 1 mm)\",\"Vernier calipers (sensitivity 0.1 mm)\",\"A micrometer screw gauge (sensitivity 0.01 mm)\",\"A measuring cylinder\"],\n    answer:2,\n    explain:\"The diameter is under 1 mm, so a meter rule is useless and vernier calipers are marginal. The micrometer screw gauge has the sensitivity (0.01 mm) to measure it accurately.\" },\n\n  { q:\"How many significant figures are in the measurement 0.0045 m?\",\n    options:[\"2\",\"3\",\"4\",\"6\"],\n    answer:0,\n    explain:\"Leading zeros are never significant, so only the '4' and '5' count → 2 significant figures.\" },\n\n  { q:\"How many significant figures are in 2.500 g?\",\n    options:[\"2\",\"3\",\"4\",\"5\"],\n    answer:2,\n    explain:\"Trailing zeros after a decimal point ARE significant → 2, 5, 0, 0 = 4 significant figures.\" },\n\n  { q:\"When multiplying or dividing measured values, the answer should be rounded to:\",\n    options:[\"The least number of decimal places in the data\",\"The least number of significant figures in the data\",\"The greatest number of significant figures in the data\",\"Two decimal places always\"],\n    answer:1,\n    explain:\"Multiplication/division → least significant figures. Addition/subtraction → least decimal places.\" },\n\n  { q:\"A rectangle measures 0.456 m × 0.23 m. To the correct number of significant figures, the area is:\",\n    options:[\"0.10488 m²\",\"0.105 m²\",\"0.10 m²\",\"0.1 m²\"],\n    answer:2,\n    explain:\"0.456 × 0.23 = 0.10488 m². The limiting value (0.23) has 2 sig figs, so the answer rounds to 0.10 m².\" },\n\n  { q:\"Density is correctly defined as:\",\n    options:[\"Volume per unit mass\",\"Mass per unit volume\",\"Mass per unit area\",\"Weight per unit volume\"],\n    answer:1,\n    explain:\"ρ = m/V, expressed in g/cm³ or kg/m³. 1 g/cm³ = 1000 kg/m³.\" },\n\n  { q:\"An irregular stone is lowered into a measuring cylinder and the water level rises from 50.0 mL to 78.0 mL. The volume of the stone is:\",\n    options:[\"78.0 cm³\",\"50.0 cm³\",\"28.0 cm³\",\"128.0 cm³\"],\n    answer:2,\n    explain:\"Water displacement method: 78.0 − 50.0 = 28.0 mL = 28.0 cm³ (1 mL = 1 cm³).\" },\n\n  { q:\"1 g/cm³ is equal to:\",\n    options:[\"10 kg/m³\",\"100 kg/m³\",\"1000 kg/m³\",\"0.001 kg/m³\"],\n    answer:2,\n    explain:\"Multiply g/cm³ by 1000 to convert to kg/m³. To convert kg/m³ back to g/cm³, divide by 1000.\" },\n\n  { q:\"When reading the volume of a liquid in a measuring cylinder, you should:\",\n    options:[\"Read the top of the meniscus with your eye above the scale\",\"Read the bottom of the meniscus with your eye level with it\",\"Read the middle of the meniscus from any angle\",\"Estimate the highest point the liquid reaches\"],\n    answer:1,\n    explain:\"Read at the bottom of the meniscus with your eye level with the scale to avoid parallax error.\" }\n];\n\n/* ============================================================\n   TAB SWITCHING\n   ============================================================ */\ndocument.querySelectorAll('.tab').forEach(tab=>{\n  tab.addEventListener('click', ()=>{\n    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));\n    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));\n    tab.classList.add('active');\n    document.getElementById(tab.dataset.target).classList.add('active');\n  });\n});\n\n/* ============================================================\n   FLASHCARD ENGINE\n   ============================================================ */\nlet deck = CARDS.slice();\nlet ci = 0;\n\nconst cardEl   = document.getElementById('card');\nconst fcTerm   = document.getElementById('fcTerm');\nconst fcDef    = document.getElementById('fcDef');\nconst fcTagF   = document.getElementById('fcTagFront');\nconst fcTagB   = document.getElementById('fcTagBack');\nconst fcCount  = document.getElementById('fcCount');\nconst fcBar    = document.getElementById('fcBar');\nconst fcPrev   = document.getElementById('fcPrev');\nconst fcNext   = document.getElementById('fcNext');\n\nfunction renderCard(){\n  const c = deck[ci];\n  fcTerm.textContent = c.term;\n  fcDef.textContent  = c.def;\n  fcTagF.textContent = c.tag;\n  fcTagB.textContent = c.tag;\n  cardEl.classList.remove('flipped');\n  fcCount.textContent = (ci+1) + ' / ' + deck.length;\n  fcBar.style.width = ((ci+1)/deck.length*100) + '%';\n  fcPrev.disabled = ci === 0;\n  fcNext.disabled = ci === deck.length - 1;\n}\n\ncardEl.addEventListener('click', ()=> cardEl.classList.toggle('flipped'));\n\ndocument.getElementById('fcFlip').addEventListener('click', e=>{\n  e.stopPropagation();\n  cardEl.classList.toggle('flipped');\n});\nfcPrev.addEventListener('click', ()=>{ if(ci>0){ ci--; renderCard(); } });\nfcNext.addEventListener('click', ()=>{ if(ci\u003cdeck.length-1){ ci++; renderCard(); } });\n\ndocument.getElementById('fcShuffle').addEventListener('click', ()=>{\n  for(let i=deck.length-1;i>0;i--){\n    const j = Math.floor(Math.random()*(i+1));\n    [deck[i],deck[j]] = [deck[j],deck[i]];\n  }\n  ci = 0;\n  renderCard();\n});\n\n/* keyboard support */\ndocument.addEventListener('keydown', e=>{\n  if(!document.getElementById('flashcards').classList.contains('active')) return;\n  if(e.key === 'ArrowRight' && ci \u003c deck.length-1){ ci++; renderCard(); }\n  if(e.key === 'ArrowLeft'  && ci > 0){ ci--; renderCard(); }\n  if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); cardEl.classList.toggle('flipped'); }\n});\n\nrenderCard();\n\n/* ============================================================\n   QUIZ ENGINE\n   ============================================================ */\nconst quizBody = document.getElementById('quizBody');\nlet qi = 0, score = 0, locked = false, picks = [];\n\nfunction renderQuestion(){\n  locked = false;\n  const q = QUESTIONS[qi];\n\n  quizBody.innerHTML = `\n    \u003cdiv class=\"q-meta\">\n      \u003cspan>Question ${qi+1} of ${QUESTIONS.length}\u003c/span>\n      \u003cspan class=\"score-pill\">Score: ${score}\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"track\">\u003cspan style=\"width:${(qi/QUESTIONS.length)*100}%\">\u003c/span>\u003c/div>\n    \u003ch3 class=\"q-text\">${q.q}\u003c/h3>\n    \u003cdiv class=\"options\" id=\"options\">\u003c/div>\n    \u003cdiv class=\"feedback\" id=\"feedback\">\u003c/div>\n    \u003cbutton class=\"btn primary\" id=\"nextBtn\" style=\"display:none;\">\n      ${qi === QUESTIONS.length-1 ? 'See Results →' : 'Next Question →'}\n    \u003c/button>\n  `;\n\n  const optWrap = document.getElementById('options');\n  const letters = ['A','B','C','D'];\n\n  q.options.forEach((opt, i)=>{\n    const b = document.createElement('button');\n    b.className = 'option';\n    b.innerHTML = `\u003cspan class=\"letter\">${letters[i]}\u003c/span>\u003cspan>${opt}\u003c/span>`;\n    b.addEventListener('click', ()=> chooseAnswer(i, b));\n    optWrap.appendChild(b);\n  });\n\n  document.getElementById('nextBtn').addEventListener('click', ()=>{\n    if(qi === QUESTIONS.length - 1){ showResults(); }\n    else { qi++; renderQuestion(); }\n  });\n}\n\nfunction chooseAnswer(selected, btn){\n  if(locked) return;\n  locked = true;\n\n  const q = QUESTIONS[qi];\n  const buttons = document.querySelectorAll('#options .option');\n  const fb = document.getElementById('feedback');\n  const correct = selected === q.answer;\n\n  picks[qi] = selected;\n  if(correct) score++;\n\n  buttons.forEach((b, i)=>{\n    b.disabled = true;\n    if(i === q.answer) b.classList.add('correct');\n    else if(i === selected) b.classList.add('wrong');\n    else b.classList.add('dim');\n  });\n\n  fb.className = 'feedback show ' + (correct ? 'ok' : 'no');\n  fb.innerHTML = `\u003cspan class=\"verdict\">${correct ? '✔ Correct!' : '✘ Not quite'}\u003c/span>${q.explain}`;\n\n  const scorePill = document.querySelector('.score-pill');\n  if(scorePill) scorePill.textContent = 'Score: ' + score;\n\n  document.getElementById('nextBtn').style.display = 'block';\n}\n\nfunction showResults(){\n  const total = QUESTIONS.length;\n  const pct = Math.round((score/total)*100);\n\n  let msg = '';\n  if(pct >= 90)      msg = \"Outstanding! You have mastered Measurement & Mechanics. 🏆\";\n  else if(pct >= 75) msg = \"Excellent work — just polish a few details. ⭐\";\n  else if(pct >= 60) msg = \"Good effort. Review the flashcards and try again. 📘\";\n  else if(pct >= 40) msg = \"You're getting there — revisit the key definitions. 🔁\";\n  else               msg = \"Don't worry! Work through the flashcards first, then retry. 💪\";\n\n  let reviewHTML = '';\n  QUESTIONS.forEach((q, i)=>{\n    const user = picks[i];\n    const ok = user === q.answer;\n    const letters = ['A','B','C','D'];\n    reviewHTML += `\n      \u003cdiv class=\"review-item ${ok ? 'ok' : ''}\">\n        \u003cdiv class=\"review-q\">${i+1}. ${q.q}\u003c/div>\n        \u003cdiv class=\"review-a\">\n          Correct answer: \u003cb>${letters[q.answer]}. ${q.options[q.answer]}\u003c/b>\u003cbr>\n          ${ok ? '' : `Your answer: \u003ci>${user !== undefined ? letters[user] + '. ' + q.options[user] : 'Not answered'}\u003c/i>\u003cbr>`}\n          ${q.explain}\n        \u003c/div>\n      \u003c/div>\n    `;\n  });\n\n  quizBody.innerHTML = `\n    \u003cdiv class=\"result-hero\">\n      \u003cdiv style=\"font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:800;\">\n        Your Result\n      \u003c/div>\n      \u003cdiv class=\"result-score\">${score} / ${total}\u003c/div>\n      \u003cdiv style=\"font-size:1.1rem;font-weight:800;color:var(--gold);\">${pct}%\u003c/div>\n      \u003cp class=\"result-msg\">${msg}\u003c/p>\n      \u003cbutton class=\"btn gold\" id=\"retryBtn\" style=\"margin-top:20px;padding:14px 26px;\">\n        🔄 Retake Quiz\n      \u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"review-title\">Answer Review\u003c/div>\n    ${reviewHTML}\n  `;\n\n  document.getElementById('retryBtn').addEventListener('click', ()=>{\n    qi = 0; score = 0; picks = [];\n    renderQuestion();\n  });\n\n  window.scrollTo({ top: 0, behavior: 'smooth' });\n}\n\nrenderQuestion();\n\u003c/script>\n\u003c/body>\n\u003c/html>"},{"id":"it_mufklulqgkli","type":"quiz","title":"VOL 02 · ISS #1 — MATTER & THERMAL ENERGY: Heat Nature  Interactive Revision · Flashcards & Quiz","desc":"","tags":[],"html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\" />\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n\u003ctitle>Au-CHIVES | Matter &amp; Thermal Energy – Heat Nature | Flashcards &amp; Quiz\u003c/title>\n\u003cstyle>\n  :root{\n    --bg:#0a0710;\n    --panel:#150f22;\n    --panel2:#1d1530;\n    --line:#2f2445;\n    --txt:#efe9fb;\n    --muted:#a396bd;\n    --teal:#2dd4bf;\n    --gold:#f5c842;\n    --orange:#fb923c;\n    --blue:#60a5fa;\n    --red:#f87171;\n    --green:#34d399;\n    --purple:#a78bfa;\n  }\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;}\n  body{\n    background:\n      radial-gradient(900px 500px at 15% -10%, rgba(251,146,60,.12), transparent 60%),\n      radial-gradient(800px 500px at 90% 0%, rgba(167,139,250,.12), transparent 60%),\n      var(--bg);\n    color:var(--txt);\n    font-family:\"Segoe UI\", Montserrat, system-ui, -apple-system, sans-serif;\n    min-height:100vh;\n    padding:24px 16px 60px;\n  }\n  .app{max-width:920px;margin:0 auto;}\n\n  /* ---------- HERO ---------- */\n  .hero{\n    background:linear-gradient(160deg, #1c1329 0%, #100b1a 100%);\n    border:1px solid var(--line);\n    border-radius:20px;\n    padding:26px 24px;\n    text-align:center;\n    position:relative;\n    overflow:hidden;\n  }\n  .hero::before{\n    content:\"\";position:absolute;inset:0;\n    background:radial-gradient(600px 200px at 50% -40%, rgba(251,146,60,.18), transparent 70%);\n    pointer-events:none;\n  }\n  .brand{\n    font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;\n    color:var(--gold);font-weight:700;margin-bottom:10px;\n  }\n  .hero h1{\n    margin:0;font-size:clamp(1.9rem,6vw,2.9rem);letter-spacing:.06em;\n    background:linear-gradient(90deg,var(--orange),var(--gold) 45%,var(--purple));\n    -webkit-background-clip:text;background-clip:text;color:transparent;\n    font-weight:800;\n  }\n  .issue{margin:8px 0 4px;font-size:.88rem;color:var(--txt);font-weight:600;}\n  .sub{margin:0;font-size:.78rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}\n\n  /* ---------- TABS ---------- */\n  .tabs{display:flex;gap:10px;margin:20px 0 16px;}\n  .tab{\n    flex:1;padding:13px 10px;border-radius:14px;cursor:pointer;\n    background:var(--panel);border:1px solid var(--line);\n    color:var(--muted);font-size:.92rem;font-weight:700;letter-spacing:.03em;\n    transition:.2s;font-family:inherit;\n  }\n  .tab:hover{border-color:var(--orange);color:var(--txt);}\n  .tab.active{\n    background:linear-gradient(135deg, rgba(251,146,60,.2), rgba(167,139,250,.2));\n    border-color:var(--orange);color:#fff;\n    box-shadow:0 0 0 1px rgba(251,146,60,.4), 0 8px 24px -12px rgba(251,146,60,.65);\n  }\n  .panel{display:none;animation:fade .35s ease;}\n  .panel.active{display:block;}\n  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}\n\n  /* ---------- FLASHCARDS ---------- */\n  .fc-bar{\n    display:flex;justify-content:space-between;align-items:center;\n    font-size:.8rem;color:var(--muted);margin-bottom:10px;font-weight:600;\n    letter-spacing:.06em;\n  }\n  .track{height:6px;background:#1d1530;border-radius:99px;overflow:hidden;margin-bottom:18px;}\n  .track > span{\n    display:block;height:100%;width:0;\n    background:linear-gradient(90deg,var(--orange),var(--gold));\n    border-radius:99px;transition:width .35s ease;\n  }\n\n  .card{\n    perspective:1400px;height:360px;cursor:pointer;\n    margin-bottom:18px;\n  }\n  .card-inner{\n    position:relative;width:100%;height:100%;\n    transform-style:preserve-3d;transition:transform .65s cubic-bezier(.4,.2,.2,1);\n  }\n  .card.flipped .card-inner{transform:rotateY(180deg);}\n  .face{\n    position:absolute;inset:0;\n    backface-visibility:hidden;-webkit-backface-visibility:hidden;\n    border-radius:20px;border:1px solid var(--line);\n    display:flex;flex-direction:column;justify-content:center;\n    padding:28px 26px;overflow:auto;text-align:center;\n  }\n  .face.front{\n    background:linear-gradient(160deg,#2a1a3d,#170f26);\n    box-shadow:inset 0 0 60px -30px var(--orange);\n  }\n  .face.back{\n    background:linear-gradient(160deg,#1a2438,#140e22);\n    transform:rotateY(180deg);\n    box-shadow:inset 0 0 60px -30px var(--blue);\n  }\n  .pill{\n    align-self:center;\n    font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;font-weight:800;\n    padding:5px 12px;border-radius:99px;margin-bottom:16px;\n    background:rgba(251,146,60,.16);color:var(--orange);border:1px solid rgba(251,146,60,.4);\n    white-space:nowrap;\n  }\n  .face.back .pill{\n    background:rgba(96,165,250,.16);color:var(--blue);border-color:rgba(96,165,250,.4);\n  }\n  .term{\n    font-size:clamp(1.3rem,4.4vw,1.85rem);font-weight:800;margin:0;\n    letter-spacing:.01em;\n  }\n  .def{font-size:clamp(.9rem,2.55vw,1rem);line-height:1.65;margin:0;color:#ded6f0;}\n  .hint{font-size:.7rem;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:18px;}\n\n  .fc-controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}\n  .btn{\n    padding:13px 12px;border-radius:13px;border:1px solid var(--line);\n    background:var(--panel2);color:var(--txt);font-weight:700;font-size:.87rem;\n    cursor:pointer;transition:.18s;font-family:inherit;letter-spacing:.02em;\n  }\n  .btn:hover:not(:disabled){border-color:var(--orange);background:#2a1c40;transform:translateY(-1px);}\n  .btn:disabled{opacity:.35;cursor:not-allowed;}\n  .btn.primary{\n    background:linear-gradient(135deg,var(--orange),#e0761f);\n    color:#2a1000;border-color:transparent;\n  }\n  .btn.primary:hover{filter:brightness(1.08);}\n  .btn.gold{\n    background:linear-gradient(135deg,var(--gold),#e0a92a);\n    color:#2a1e00;border-color:transparent;\n  }\n\n  /* ---------- QUIZ ---------- */\n  .q-meta{\n    display:flex;justify-content:space-between;align-items:center;\n    font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;\n    color:var(--muted);margin-bottom:10px;\n  }\n  .score-pill{\n    background:rgba(245,200,66,.13);color:var(--gold);\n    border:1px solid rgba(245,200,66,.35);\n    padding:4px 11px;border-radius:99px;font-size:.7rem;\n  }\n  .q-text{\n    font-size:clamp(1.02rem,3.4vw,1.2rem);line-height:1.55;font-weight:700;\n    margin:20px 0 18px;\n  }\n  .options{display:flex;flex-direction:column;gap:10px;}\n  .option{\n    text-align:left;padding:14px 16px;border-radius:13px;\n    background:var(--panel2);border:1.5px solid var(--line);color:var(--txt);\n    font-size:.93rem;line-height:1.45;cursor:pointer;transition:.16s;\n    font-family:inherit;display:flex;gap:12px;align-items:flex-start;\n  }\n  .option .letter{\n    flex:0 0 24px;height:24px;border-radius:7px;\n    background:#120c1e;border:1px solid var(--line);\n    display:flex;align-items:center;justify-content:center;\n    font-size:.72rem;font-weight:800;color:var(--muted);\n  }\n  .option:hover:not(:disabled){border-color:var(--blue);background:#241a3a;transform:translateX(3px);}\n  .option:disabled{cursor:default;}\n  .option.correct{\n    border-color:var(--green);background:rgba(52,211,153,.13);\n  }\n  .option.correct .letter{background:var(--green);color:#04231a;border-color:transparent;}\n  .option.wrong{\n    border-color:var(--red);background:rgba(248,113,113,.13);\n  }\n  .option.wrong .letter{background:var(--red);color:#2b0505;border-color:transparent;}\n  .option.dim{opacity:.5;}\n\n  .feedback{\n    margin-top:16px;padding:15px 17px;border-radius:13px;\n    border-left:4px solid var(--blue);background:#181128;\n    font-size:.88rem;line-height:1.6;color:#d5cbe9;display:none;\n  }\n  .feedback.show{display:block;animation:fade .3s ease;}\n  .feedback .verdict{font-weight:800;display:block;margin-bottom:6px;letter-spacing:.05em;}\n  .feedback.ok{border-left-color:var(--green);}\n  .feedback.ok .verdict{color:var(--green);}\n  .feedback.no{border-left-color:var(--red);}\n  .feedback.no .verdict{color:var(--red);}\n\n  #nextBtn{margin-top:16px;width:100%;}\n\n  /* ---------- RESULTS ---------- */\n  .result-hero{\n    text-align:center;padding:34px 22px;border-radius:20px;\n    border:1px solid var(--line);\n    background:linear-gradient(160deg,#221638,#100b1a);\n  }\n  .result-score{\n    font-size:clamp(2.6rem,12vw,4rem);font-weight:900;line-height:1;margin:6px 0;\n    background:linear-gradient(90deg,var(--orange),var(--gold));\n    -webkit-background-clip:text;background-clip:text;color:transparent;\n  }\n  .result-msg{color:var(--muted);font-size:.95rem;margin:10px 0 0;}\n  .review-title{\n    margin:28px 0 12px;font-size:.78rem;letter-spacing:.18em;\n    text-transform:uppercase;color:var(--muted);font-weight:800;\n  }\n  .review-item{\n    background:var(--panel);border:1px solid var(--line);\n    border-radius:14px;padding:15px 16px;margin-bottom:10px;\n    border-left:4px solid var(--red);\n  }\n  .review-item.ok{border-left-color:var(--green);}\n  .review-q{font-size:.88rem;font-weight:700;line-height:1.5;margin-bottom:8px;}\n  .review-a{font-size:.8rem;line-height:1.6;color:var(--muted);}\n  .review-a b{color:var(--green);}\n  .review-a i{color:var(--red);font-style:normal;}\n\n  footer{\n    text-align:center;margin-top:36px;font-size:.7rem;color:#6b5c85;\n    letter-spacing:.1em;text-transform:uppercase;line-height:1.9;\n  }\n\n  @media(max-width:520px){\n    .card{height:405px;}\n    .face{padding:22px 18px;}\n    .fc-controls{grid-template-columns:1fr 1fr;}\n    .fc-controls .btn.gold{grid-column:span 2;}\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"app\">\n\n  \u003cheader class=\"hero\">\n    \u003cdiv class=\"brand\">Gold'n Geniuz Online Tutoring Services\u003c/div>\n    \u003ch1>Au-CHIVES\u003c/h1>\n    \u003cp class=\"issue\">VOL 02 · ISS #1 — MATTER &amp; THERMAL ENERGY: Heat Nature\u003c/p>\n    \u003cp class=\"sub\">Interactive Revision · Flashcards &amp; Quiz\u003c/p>\n  \u003c/header>\n\n  \u003cnav class=\"tabs\">\n    \u003cbutton class=\"tab active\" data-target=\"flashcards\">🃏 Flashcards\u003c/button>\n    \u003cbutton class=\"tab\" data-target=\"quiz\">📝 Quiz\u003c/button>\n  \u003c/nav>\n\n  \u003c!-- ============ FLASHCARDS ============ -->\n  \u003csection id=\"flashcards\" class=\"panel active\">\n    \u003cdiv class=\"fc-bar\">\n      \u003cspan id=\"fcCount\">1 / 20\u003c/span>\n      \u003cspan>Tap card to flip\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"track\">\u003cspan id=\"fcBar\">\u003c/span>\u003c/div>\n\n    \u003cdiv class=\"card\" id=\"card\">\n      \u003cdiv class=\"card-inner\">\n        \u003cdiv class=\"face front\">\n          \u003cdiv class=\"pill\" id=\"fcTagFront\">KEY TERM\u003c/div>\n          \u003ch2 class=\"term\" id=\"fcTerm\">—\u003c/h2>\n          \u003cp class=\"hint\">Tap to reveal\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"face back\">\n          \u003cdiv class=\"pill\" id=\"fcTagBack\">DEFINITION\u003c/div>\n          \u003cp class=\"def\" id=\"fcDef\">—\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"fc-controls\">\n      \u003cbutton class=\"btn\" id=\"fcPrev\">← Prev\u003c/button>\n      \u003cbutton class=\"btn primary\" id=\"fcFlip\">Flip\u003c/button>\n      \u003cbutton class=\"btn\" id=\"fcNext\">Next →\u003c/button>\n      \u003cbutton class=\"btn gold\" id=\"fcShuffle\" style=\"grid-column:1/-1\">🔀 Shuffle Deck\u003c/button>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- ============ QUIZ ============ -->\n  \u003csection id=\"quiz\" class=\"panel\">\n    \u003cdiv id=\"quizBody\">\u003c/div>\n  \u003c/section>\n\n  \u003cfooter>\n    Au-CHIVES · The Students Workbook for Physics\u003cbr>\n    © Gold'n Geniuz Online Tutoring Services — Kingston, Jamaica\n  \u003c/footer>\n\u003c/div>\n\n\u003cscript>\n/* ============================================================\n   VOCABULARY — 20 KEY CSEC PHYSICS TERMS\n   (VOL 02 · ISS #1 — Heat Nature)\n   ============================================================ */\nconst CARDS = [\n  { term:\"Caloric Theory\", tag:\"Heat Theories\",\n    def:\"The pre-1800s theory that heat is a material substance called 'caloric' — an invisible fluid that flows from hot bodies to cold ones. Heating = adding caloric; cooling = removing caloric.\" },\n\n  { term:\"Caloric\", tag:\"Heat Theories\",\n    def:\"The hypothetical invisible fluid of the caloric theory. It was said to be indestructible, massless and conserved, and to flow 'downhill' from a hotter object to a cooler one.\" },\n\n  { term:\"Kinetic Theory\", tag:\"Heat Theories\",\n    def:\"The theory that heat is NOT a substance but the energy of motion (kinetic energy) of the tiny atoms and molecules that make up all matter. Hotter objects have faster-moving particles.\" },\n\n  { term:\"Heat\", tag:\"Core Concept\",\n    def:\"Energy in transit from a hotter body to a cooler body because of a temperature difference. Heat is a form of energy, not a substance — the central conclusion of Joule's work.\" },\n\n  { term:\"Temperature\", tag:\"Core Concept\",\n    def:\"A measure of the average kinetic energy of the particles in a substance. In kinetic theory, a higher temperature means faster particle motion.\" },\n\n  { term:\"Internal Energy\", tag:\"Core Concept\",\n    def:\"The total kinetic and potential energy of all the particles in a body. Heating a body or doing work on it increases its internal energy.\" },\n\n  { term:\"Friction\", tag:\"Evidence\",\n    def:\"The force opposing relative motion between surfaces in contact. Rubbing produces heat continuously and seemingly without limit — strong evidence against caloric theory and support for kinetic theory.\" },\n\n  { term:\"Mechanical Equivalent of Heat\", tag:\"Joule\",\n    def:\"The constant ratio between mechanical work input and heat produced: about 4.18 J of work produces 1 calorie of heat. Measured precisely by James Prescott Joule.\" },\n\n  { term:\"James Prescott Joule\", tag:\"Joule\",\n    def:\"English physicist (1818–1889) whose paddle-wheel, electrical-heating and gas-compression experiments proved work and heat are interconvertible, resolving the caloric vs kinetic debate.\" },\n\n  { term:\"Paddle Wheel Experiment\", tag:\"Joule\",\n    def:\"Joule's classic apparatus: a falling weight turns a paddle wheel inside water, and friction with the water raises its temperature. Work done = mgh; heat gained = mcΔT.\" },\n\n  { term:\"Conservation of Energy\", tag:\"Law\",\n    def:\"Energy can neither be created nor destroyed — it can only be converted from one form to another. The total amount of energy in the universe remains constant.\" },\n\n  { term:\"First Law of Thermodynamics\", tag:\"Law\",\n    def:\"The formal statement of energy conservation for thermodynamic systems: the change in internal energy equals the heat supplied plus the work done on the system.\" },\n\n  { term:\"Thermodynamics\", tag:\"Field\",\n    def:\"The branch of physics that studies heat, work, energy transfer and conversion, and the laws governing energy changes in systems.\" },\n\n  { term:\"Work (Mechanical)\", tag:\"Core Concept\",\n    def:\"Energy transferred when a force moves an object through a distance: W = F × d. In Joule's experiment the work done by the falling weight = mass × g × distance fallen.\" },\n\n  { term:\"Energy Conversion\", tag:\"Core Concept\",\n    def:\"The change of energy from one form to another — e.g. gravitational potential → kinetic → heat. Joule showed the total energy stays the same during conversion.\" },\n\n  { term:\"Count Rumford\", tag:\"History\",\n    def:\"Benjamin Thompson, who observed that boring cannon barrels produced seemingly unlimited heat from friction. This suggested heat was motion, not a finite substance like caloric.\" },\n\n  { term:\"Kinetic Theory of Gases\", tag:\"History\",\n    def:\"The mathematical development of kinetic theory by Maxwell and Boltzmann, explaining gas pressure and temperature in terms of the motion of particles.\" },\n\n  { term:\"Joule (Unit)\", tag:\"Units\",\n    def:\"The SI unit of energy and work, named after James Prescott Joule. About 4.18 joules of energy equals 1 calorie of heat.\" },\n\n  { term:\"Specific Heat Capacity\", tag:\"Measurement\",\n    def:\"The heat energy needed to raise the temperature of unit mass of a substance by 1 K. Used in Joule's calculation: Heat = mass × specific heat capacity × temperature change.\" },\n\n  { term:\"Empirical Evidence\", tag:\"Methodology\",\n    def:\"Evidence obtained through observation, measurement and reproducible experiment rather than pure reasoning. Joule's precise measurements were the empirical evidence that overturned caloric theory.\" }\n];\n\n/* ============================================================\n   QUIZ — 20 QUESTIONS\n   ============================================================ */\nconst QUESTIONS = [\n  { q:\"In the caloric theory, heat was thought to be:\",\n    options:[\"The motion of tiny particles\",\"A massless, indestructible fluid called caloric\",\"A form of electrical energy\",\"A type of wave travelling through a vacuum\"],\n    answer:1,\n    explain:\"Caloric theory treated heat as a material fluid — invisible, massless and indestructible — that could flow from one body to another.\" },\n\n  { q:\"According to caloric theory, when a hot object touches a cold object:\",\n    options:[\"Caloric flows from the cold object to the hot object\",\"Caloric flows from the hot object to the cold object\",\"Both objects lose caloric equally\",\"Caloric is created inside the cold object\"],\n    answer:1,\n    explain:\"Caloric was said to flow 'downhill' — from the hotter body (more caloric) to the cooler body (less caloric), until both were equal.\" },\n\n  { q:\"Which observation was MOST difficult for the caloric theory to explain?\",\n    options:[\"Metals expand when heated\",\"Heat flows from hot to cold\",\"Friction can produce heat continuously and without limit\",\"Different materials have different heat capacities\"],\n    answer:2,\n    explain:\"Rubbing could produce heat endlessly, which contradicted the idea that caloric was a finite, indestructible substance that could not be created.\" },\n\n  { q:\"The kinetic theory states that heat is:\",\n    options:[\"A substance stored inside objects\",\"The energy of motion of the tiny particles that make up matter\",\"A fluid that flows downhill from hot to cold\",\"A form of gravitational potential energy\"],\n    answer:1,\n    explain:\"Kinetic theory says heat is the kinetic energy of atoms and molecules — not a material substance.\" },\n\n  { q:\"In kinetic theory, temperature is a measure of:\",\n    options:[\"The total mass of the particles\",\"The average kinetic energy of the particles\",\"The amount of caloric present\",\"The volume of the object\"],\n    answer:1,\n    explain:\"Temperature measures the average kinetic energy of the particles — the faster they move, the higher the temperature.\" },\n\n  { q:\"Which scientist measured the mechanical equivalent of heat using a falling weight turning a paddle wheel?\",\n    options:[\"Count Rumford\",\"James Prescott Joule\",\"Antoine Lavoisier\",\"Daniel Bernoulli\"],\n    answer:1,\n    explain:\"James Prescott Joule used the falling-weight paddle-wheel apparatus to measure how much work produces a given amount of heat.\" },\n\n  { q:\"In Joule's paddle-wheel experiment, the water's temperature rises because:\",\n    options:[\"The weight heats the water directly by contact\",\"Friction between the rotating paddles and the water converts mechanical work into heat\",\"Caloric flows from the weight into the water\",\"The water expands and cools the container\"],\n    answer:1,\n    explain:\"The falling weight does mechanical work on the paddles; friction between paddles and water converts that work into heat energy.\" },\n\n  { q:\"In Joule's experiment, the work done by the falling weight is calculated using:\",\n    options:[\"mass × g × distance fallen\",\"mass × specific heat capacity × ΔT\",\"force ÷ area\",\"½ × mass × velocity²\"],\n    answer:0,\n    explain:\"Work = force × distance = (mass × g) × distance fallen = mgh.\" },\n\n  { q:\"The heat gained by the water in Joule's experiment is calculated using:\",\n    options:[\"m × g × h\",\"m × c × ΔT\",\"m × v\",\"F × d\"],\n    answer:1,\n    explain:\"Heat = mass × specific heat capacity × temperature change (mcΔT).\" },\n\n  { q:\"The mechanical equivalent of heat is approximately:\",\n    options:[\"1 J per calorie\",\"4.18 J per calorie\",\"1000 J per calorie\",\"0.24 J per calorie\"],\n    answer:1,\n    explain:\"Joule found that about 4.18 joules of mechanical work produce 1 calorie of heat — a constant ratio.\" },\n\n  { q:\"Joule's experiments dealt a fatal blow to caloric theory because:\",\n    options:[\"He discovered particles of caloric\",\"Heat could be produced from mechanical work, so it is not a conserved substance\",\"He proved that heat has measurable mass\",\"He showed heat flows from cold to hot\"],\n    answer:1,\n    explain:\"If heat can be created from work, it cannot be an indestructible fluid — it must be a form of energy.\" },\n\n  { q:\"The principle of conservation of energy states that energy:\",\n    options:[\"Is always eventually lost as heat\",\"Can be created by efficient machines\",\"Cannot be created or destroyed, only converted from one form to another\",\"Only exists in mechanical forms\"],\n    answer:2,\n    explain:\"Energy is conserved: it changes form but the total amount remains constant.\" },\n\n  { q:\"Which law is the formal statement of energy conservation in thermodynamic systems?\",\n    options:[\"Zeroth Law of Thermodynamics\",\"First Law of Thermodynamics\",\"Second Law of Thermodynamics\",\"Third Law of Thermodynamics\"],\n    answer:1,\n    explain:\"The First Law of Thermodynamics expresses energy conservation for heat and work in a system.\" },\n\n  { q:\"Thermodynamics is the branch of physics that studies:\",\n    options:[\"Only electrical circuits\",\"Heat, work, energy transfer and conversion\",\"Only the motion of planets\",\"The internal structure of the atom\"],\n    answer:1,\n    explain:\"Thermodynamics deals with heat, work, energy transfer and energy conversion in systems.\" },\n\n  { q:\"Count Rumford's observation of heat produced when boring cannon barrels suggested that:\",\n    options:[\"Heat was a substance called caloric\",\"Heat was related to motion and could be produced without limit\",\"Heat had measurable mass\",\"Heat could not be produced by friction\"],\n    answer:1,\n    explain:\"Rumford noted the heat from friction seemed endless, implying heat is motion rather than a finite material substance.\" },\n\n  { q:\"Which pair of scientists developed the kinetic theory of gases mathematically?\",\n    options:[\"Joule and Rumford\",\"Maxwell and Boltzmann\",\"Carnot and Watt\",\"Lavoisier and Laplace\"],\n    answer:1,\n    explain:\"Maxwell and Boltzmann put kinetic theory on a firm mathematical footing, explaining gas pressure and temperature.\" },\n\n  { q:\"The SI unit of energy is the:\",\n    options:[\"Calorie\",\"Joule\",\"Newton\",\"Watt\"],\n    answer:1,\n    explain:\"The joule (J) is the SI unit of energy and work, named in honour of James Prescott Joule.\" },\n\n  { q:\"Why was the kinetic theory initially rejected by many scientists?\",\n    options:[\"It had no mathematical basis whatsoever\",\"Caloric theory was well established, atoms could not be directly observed, and the mathematics was not yet developed\",\"It contradicted the law of conservation of energy\",\"It could not explain why gases exert pressure\"],\n    answer:1,\n    explain:\"Caloric theory was accepted, there was no direct evidence of atoms, and the mathematical framework was not yet available.\" },\n\n  { q:\"In the shift from caloric to kinetic theory, scientific thinking moved from:\",\n    options:[\"'Motion' to thinking about 'substance'\",\"'Substance' to thinking about 'motion'\",\"'Energy' to thinking about 'mass'\",\"'Heat' to thinking about 'temperature'\"],\n    answer:1,\n    explain:\"Scientists stopped treating heat as a material substance and began treating it as the motion of particles.\" },\n\n  { q:\"Which statement about heat and temperature is CORRECT?\",\n    options:[\"Heat and temperature are the same thing\",\"Heat is energy in transit; temperature measures the average kinetic energy of particles\",\"Temperature is a form of energy and heat is a substance\",\"Both are substances that flow from hot to cold\"],\n    answer:1,\n    explain:\"Heat is energy transferred due to a temperature difference; temperature measures the average kinetic energy of the particles.\" }\n];\n\n/* ============================================================\n   TAB SWITCHING\n   ============================================================ */\ndocument.querySelectorAll('.tab').forEach(tab=>{\n  tab.addEventListener('click', ()=>{\n    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));\n    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));\n    tab.classList.add('active');\n    document.getElementById(tab.dataset.target).classList.add('active');\n  });\n});\n\n/* ============================================================\n   FLASHCARD ENGINE\n   ============================================================ */\nlet deck = CARDS.slice();\nlet ci = 0;\n\nconst cardEl   = document.getElementById('card');\nconst fcTerm   = document.getElementById('fcTerm');\nconst fcDef    = document.getElementById('fcDef');\nconst fcTagF   = document.getElementById('fcTagFront');\nconst fcTagB   = document.getElementById('fcTagBack');\nconst fcCount  = document.getElementById('fcCount');\nconst fcBar    = document.getElementById('fcBar');\nconst fcPrev   = document.getElementById('fcPrev');\nconst fcNext   = document.getElementById('fcNext');\n\nfunction renderCard(){\n  const c = deck[ci];\n  fcTerm.textContent = c.term;\n  fcDef.textContent  = c.def;\n  fcTagF.textContent = c.tag;\n  fcTagB.textContent = c.tag;\n  cardEl.classList.remove('flipped');\n  fcCount.textContent = (ci+1) + ' / ' + deck.length;\n  fcBar.style.width = ((ci+1)/deck.length*100) + '%';\n  fcPrev.disabled = ci === 0;\n  fcNext.disabled = ci === deck.length - 1;\n}\n\ncardEl.addEventListener('click', ()=> cardEl.classList.toggle('flipped'));\n\ndocument.getElementById('fcFlip').addEventListener('click', e=>{\n  e.stopPropagation();\n  cardEl.classList.toggle('flipped');\n});\nfcPrev.addEventListener('click', ()=>{ if(ci>0){ ci--; renderCard(); } });\nfcNext.addEventListener('click', ()=>{ if(ci\u003cdeck.length-1){ ci++; renderCard(); } });\n\ndocument.getElementById('fcShuffle').addEventListener('click', ()=>{\n  for(let i=deck.length-1;i>0;i--){\n    const j = Math.floor(Math.random()*(i+1));\n    [deck[i],deck[j]] = [deck[j],deck[i]];\n  }\n  ci = 0;\n  renderCard();\n});\n\n/* keyboard support */\ndocument.addEventListener('keydown', e=>{\n  if(!document.getElementById('flashcards').classList.contains('active')) return;\n  if(e.key === 'ArrowRight' && ci \u003c deck.length-1){ ci++; renderCard(); }\n  if(e.key === 'ArrowLeft'  && ci > 0){ ci--; renderCard(); }\n  if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); cardEl.classList.toggle('flipped'); }\n});\n\nrenderCard();\n\n/* ============================================================\n   QUIZ ENGINE\n   ============================================================ */\nconst quizBody = document.getElementById('quizBody');\nlet qi = 0, score = 0, locked = false, picks = [];\n\nfunction renderQuestion(){\n  locked = false;\n  const q = QUESTIONS[qi];\n\n  quizBody.innerHTML = `\n    \u003cdiv class=\"q-meta\">\n      \u003cspan>Question ${qi+1} of ${QUESTIONS.length}\u003c/span>\n      \u003cspan class=\"score-pill\">Score: ${score}\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"track\">\u003cspan style=\"width:${(qi/QUESTIONS.length)*100}%\">\u003c/span>\u003c/div>\n    \u003ch3 class=\"q-text\">${q.q}\u003c/h3>\n    \u003cdiv class=\"options\" id=\"options\">\u003c/div>\n    \u003cdiv class=\"feedback\" id=\"feedback\">\u003c/div>\n    \u003cbutton class=\"btn primary\" id=\"nextBtn\" style=\"display:none;\">\n      ${qi === QUESTIONS.length-1 ? 'See Results →' : 'Next Question →'}\n    \u003c/button>\n  `;\n\n  const optWrap = document.getElementById('options');\n  const letters = ['A','B','C','D'];\n\n  q.options.forEach((opt, i)=>{\n    const b = document.createElement('button');\n    b.className = 'option';\n    b.innerHTML = `\u003cspan class=\"letter\">${letters[i]}\u003c/span>\u003cspan>${opt}\u003c/span>`;\n    b.addEventListener('click', ()=> chooseAnswer(i, b));\n    optWrap.appendChild(b);\n  });\n\n  document.getElementById('nextBtn').addEventListener('click', ()=>{\n    if(qi === QUESTIONS.length - 1){ showResults(); }\n    else { qi++; renderQuestion(); }\n  });\n}\n\nfunction chooseAnswer(selected, btn){\n  if(locked) return;\n  locked = true;\n\n  const q = QUESTIONS[qi];\n  const buttons = document.querySelectorAll('#options .option');\n  const fb = document.getElementById('feedback');\n  const correct = selected === q.answer;\n\n  picks[qi] = selected;\n  if(correct) score++;\n\n  buttons.forEach((b, i)=>{\n    b.disabled = true;\n    if(i === q.answer) b.classList.add('correct');\n    else if(i === selected) b.classList.add('wrong');\n    else b.classList.add('dim');\n  });\n\n  fb.className = 'feedback show ' + (correct ? 'ok' : 'no');\n  fb.innerHTML = `\u003cspan class=\"verdict\">${correct ? '✔ Correct!' : '✘ Not quite'}\u003c/span>${q.explain}`;\n\n  const scorePill = document.querySelector('.score-pill');\n  if(scorePill) scorePill.textContent = 'Score: ' + score;\n\n  document.getElementById('nextBtn').style.display = 'block';\n}\n\nfunction showResults(){\n  const total = QUESTIONS.length;\n  const pct = Math.round((score/total)*100);\n\n  let msg = '';\n  if(pct >= 90)      msg = \"Outstanding! You have mastered the nature of heat. 🏆\";\n  else if(pct >= 75) msg = \"Excellent work — just polish a few details. ⭐\";\n  else if(pct >= 60) msg = \"Good effort. Review the flashcards and try again. 📘\";\n  else if(pct >= 40) msg = \"You're getting there — revisit the key theories. 🔁\";\n  else               msg = \"Don't worry! Work through the flashcards first, then retry. 💪\";\n\n  let reviewHTML = '';\n  QUESTIONS.forEach((q, i)=>{\n    const user = picks[i];\n    const ok = user === q.answer;\n    const letters = ['A','B','C','D'];\n    reviewHTML += `\n      \u003cdiv class=\"review-item ${ok ? 'ok' : ''}\">\n        \u003cdiv class=\"review-q\">${i+1}. ${q.q}\u003c/div>\n        \u003cdiv class=\"review-a\">\n          Correct answer: \u003cb>${letters[q.answer]}. ${q.options[q.answer]}\u003c/b>\u003cbr>\n          ${ok ? '' : `Your answer: \u003ci>${user !== undefined ? letters[user] + '. ' + q.options[user] : 'Not answered'}\u003c/i>\u003cbr>`}\n          ${q.explain}\n        \u003c/div>\n      \u003c/div>\n    `;\n  });\n\n  quizBody.innerHTML = `\n    \u003cdiv class=\"result-hero\">\n      \u003cdiv style=\"font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:800;\">\n        Your Result\n      \u003c/div>\n      \u003cdiv class=\"result-score\">${score} / ${total}\u003c/div>\n      \u003cdiv style=\"font-size:1.1rem;font-weight:800;color:var(--gold);\">${pct}%\u003c/div>\n      \u003cp class=\"result-msg\">${msg}\u003c/p>\n      \u003cbutton class=\"btn gold\" id=\"retryBtn\" style=\"margin-top:20px;padding:14px 26px;\">\n        🔄 Retake Quiz\n      \u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"review-title\">Answer Review\u003c/div>\n    ${reviewHTML}\n  `;\n\n  document.getElementById('retryBtn').addEventListener('click', ()=>{\n    qi = 0; score = 0; picks = [];\n    renderQuestion();\n  });\n\n  window.scrollTo({ top: 0, behavior: 'smooth' });\n}\n\nrenderQuestion();\n\u003c/script>\n\u003c/body>\n\u003c/html>"}]},{"id":"g11","name":"Grade 11","emoji":"🧠","color":"#14b8a6","blurb":"Deep dive","items":[]},{"id":"g12","name":"Grade 12","emoji":"🎯","color":"#ec4899","blurb":"Final stretch","items":[{"id":"it_mufl343l1hfj","type":"quiz","title":"VOL 01 · ISS #1 — U1 MECHANICS: Physical Quantities  Interactive Revision · Flashcards & Quiz","desc":"","tags":[],"html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\" />\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n\u003ctitle>Au-CHIVES | Physical Quantities | Flashcards &amp; Quiz\u003c/title>\n\u003cstyle>\n  :root{\n    --bg:#04100d;\n    --panel:#0c1c19;\n    --panel2:#122722;\n    --line:#1e3c34;\n    --txt:#e5fbf4;\n    --muted:#8fb3a8;\n    --emerald:#34d399;\n    --cyan:#22d3ee;\n    --gold:#f5c842;\n    --red:#f87171;\n    --green:#34d399;\n    --purple:#a78bfa;\n  }\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;}\n  body{\n    background:\n      radial-gradient(900px 500px at 15% -10%, rgba(52,211,153,.12), transparent 60%),\n      radial-gradient(800px 500px at 90% 0%, rgba(34,211,238,.12), transparent 60%),\n      var(--bg);\n    color:var(--txt);\n    font-family:\"Segoe UI\", Montserrat, system-ui, -apple-system, sans-serif;\n    min-height:100vh;\n    padding:24px 16px 60px;\n  }\n  .app{max-width:920px;margin:0 auto;}\n\n  /* ---------- HERO ---------- */\n  .hero{\n    background:linear-gradient(160deg, #0e2320 0%, #06120f 100%);\n    border:1px solid var(--line);\n    border-radius:20px;\n    padding:26px 24px;\n    text-align:center;\n    position:relative;\n    overflow:hidden;\n  }\n  .hero::before{\n    content:\"\";position:absolute;inset:0;\n    background:radial-gradient(600px 200px at 50% -40%, rgba(34,211,238,.16), transparent 70%);\n    pointer-events:none;\n  }\n  .brand{\n    font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;\n    color:var(--gold);font-weight:700;margin-bottom:10px;\n  }\n  .hero h1{\n    margin:0;font-size:clamp(1.9rem,6vw,2.9rem);letter-spacing:.06em;\n    background:linear-gradient(90deg,var(--emerald),var(--cyan) 50%,var(--gold));\n    -webkit-background-clip:text;background-clip:text;color:transparent;\n    font-weight:800;\n  }\n  .issue{margin:8px 0 4px;font-size:.88rem;color:var(--txt);font-weight:600;}\n  .sub{margin:0;font-size:.78rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}\n\n  /* ---------- TABS ---------- */\n  .tabs{display:flex;gap:10px;margin:20px 0 16px;}\n  .tab{\n    flex:1;padding:13px 10px;border-radius:14px;cursor:pointer;\n    background:var(--panel);border:1px solid var(--line);\n    color:var(--muted);font-size:.92rem;font-weight:700;letter-spacing:.03em;\n    transition:.2s;font-family:inherit;\n  }\n  .tab:hover{border-color:var(--emerald);color:var(--txt);}\n  .tab.active{\n    background:linear-gradient(135deg, rgba(52,211,153,.2), rgba(34,211,238,.2));\n    border-color:var(--emerald);color:#fff;\n    box-shadow:0 0 0 1px rgba(52,211,153,.4), 0 8px 24px -12px rgba(52,211,153,.65);\n  }\n  .panel{display:none;animation:fade .35s ease;}\n  .panel.active{display:block;}\n  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}\n\n  /* ---------- FLASHCARDS ---------- */\n  .fc-bar{\n    display:flex;justify-content:space-between;align-items:center;\n    font-size:.8rem;color:var(--muted);margin-bottom:10px;font-weight:600;\n    letter-spacing:.06em;\n  }\n  .track{height:6px;background:#122722;border-radius:99px;overflow:hidden;margin-bottom:18px;}\n  .track > span{\n    display:block;height:100%;width:0;\n    background:linear-gradient(90deg,var(--emerald),var(--cyan));\n    border-radius:99px;transition:width .35s ease;\n  }\n\n  .card{\n    perspective:1400px;height:365px;cursor:pointer;\n    margin-bottom:18px;\n  }\n  .card-inner{\n    position:relative;width:100%;height:100%;\n    transform-style:preserve-3d;transition:transform .65s cubic-bezier(.4,.2,.2,1);\n  }\n  .card.flipped .card-inner{transform:rotateY(180deg);}\n  .face{\n    position:absolute;inset:0;\n    backface-visibility:hidden;-webkit-backface-visibility:hidden;\n    border-radius:20px;border:1px solid var(--line);\n    display:flex;flex-direction:column;justify-content:center;\n    padding:28px 26px;overflow:auto;text-align:center;\n  }\n  .face.front{\n    background:linear-gradient(160deg,#0f2e28,#081713);\n    box-shadow:inset 0 0 60px -30px var(--emerald);\n  }\n  .face.back{\n    background:linear-gradient(160deg,#0e2130,#0a1622);\n    transform:rotateY(180deg);\n    box-shadow:inset 0 0 60px -30px var(--cyan);\n  }\n  .pill{\n    align-self:center;\n    font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;font-weight:800;\n    padding:5px 12px;border-radius:99px;margin-bottom:16px;\n    background:rgba(52,211,153,.16);color:var(--emerald);border:1px solid rgba(52,211,153,.4);\n    white-space:nowrap;\n  }\n  .face.back .pill{\n    background:rgba(34,211,238,.16);color:var(--cyan);border-color:rgba(34,211,238,.4);\n  }\n  .term{\n    font-size:clamp(1.25rem,4.2vw,1.8rem);font-weight:800;margin:0;\n    letter-spacing:.01em;\n  }\n  .def{font-size:clamp(.9rem,2.55vw,1rem);line-height:1.65;margin:0;color:#cdebdf;}\n  .def code{\n    background:rgba(34,211,238,.12);color:var(--cyan);\n    padding:1px 6px;border-radius:5px;font-size:.92em;\n  }\n  .hint{font-size:.7rem;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:18px;}\n\n  .fc-controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}\n  .btn{\n    padding:13px 12px;border-radius:13px;border:1px solid var(--line);\n    background:var(--panel2);color:var(--txt);font-weight:700;font-size:.87rem;\n    cursor:pointer;transition:.18s;font-family:inherit;letter-spacing:.02em;\n  }\n  .btn:hover:not(:disabled){border-color:var(--emerald);background:#17332c;transform:translateY(-1px);}\n  .btn:disabled{opacity:.35;cursor:not-allowed;}\n  .btn.primary{\n    background:linear-gradient(135deg,var(--emerald),#10a37f);\n    color:#03241a;border-color:transparent;\n  }\n  .btn.primary:hover{filter:brightness(1.08);}\n  .btn.gold{\n    background:linear-gradient(135deg,var(--gold),#e0a92a);\n    color:#2a1e00;border-color:transparent;\n  }\n\n  /* ---------- QUIZ ---------- */\n  .q-meta{\n    display:flex;justify-content:space-between;align-items:center;\n    font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;\n    color:var(--muted);margin-bottom:10px;\n  }\n  .score-pill{\n    background:rgba(245,200,66,.13);color:var(--gold);\n    border:1px solid rgba(245,200,66,.35);\n    padding:4px 11px;border-radius:99px;font-size:.7rem;\n  }\n  .q-text{\n    font-size:clamp(1.02rem,3.4vw,1.2rem);line-height:1.55;font-weight:700;\n    margin:20px 0 18px;\n  }\n  .options{display:flex;flex-direction:column;gap:10px;}\n  .option{\n    text-align:left;padding:14px 16px;border-radius:13px;\n    background:var(--panel2);border:1.5px solid var(--line);color:var(--txt);\n    font-size:.93rem;line-height:1.45;cursor:pointer;transition:.16s;\n    font-family:inherit;display:flex;gap:12px;align-items:flex-start;\n  }\n  .option .letter{\n    flex:0 0 24px;height:24px;border-radius:7px;\n    background:#081714;border:1px solid var(--line);\n    display:flex;align-items:center;justify-content:center;\n    font-size:.72rem;font-weight:800;color:var(--muted);\n  }\n  .option:hover:not(:disabled){border-color:var(--cyan);background:#173832;transform:translateX(3px);}\n  .option:disabled{cursor:default;}\n  .option.correct{\n    border-color:var(--green);background:rgba(52,211,153,.13);\n  }\n  .option.correct .letter{background:var(--green);color:#04231a;border-color:transparent;}\n  .option.wrong{\n    border-color:var(--red);background:rgba(248,113,113,.13);\n  }\n  .option.wrong .letter{background:var(--red);color:#2b0505;border-color:transparent;}\n  .option.dim{opacity:.5;}\n\n  .feedback{\n    margin-top:16px;padding:15px 17px;border-radius:13px;\n    border-left:4px solid var(--cyan);background:#0d211d;\n    font-size:.88rem;line-height:1.6;color:#c6e5db;display:none;\n  }\n  .feedback.show{display:block;animation:fade .3s ease;}\n  .feedback .verdict{font-weight:800;display:block;margin-bottom:6px;letter-spacing:.05em;}\n  .feedback.ok{border-left-color:var(--green);}\n  .feedback.ok .verdict{color:var(--green);}\n  .feedback.no{border-left-color:var(--red);}\n  .feedback.no .verdict{color:var(--red);}\n\n  #nextBtn{margin-top:16px;width:100%;}\n\n  /* ---------- RESULTS ---------- */\n  .result-hero{\n    text-align:center;padding:34px 22px;border-radius:20px;\n    border:1px solid var(--line);\n    background:linear-gradient(160deg,#0f2b26,#06120f);\n  }\n  .result-score{\n    font-size:clamp(2.6rem,12vw,4rem);font-weight:900;line-height:1;margin:6px 0;\n    background:linear-gradient(90deg,var(--emerald),var(--gold));\n    -webkit-background-clip:text;background-clip:text;color:transparent;\n  }\n  .result-msg{color:var(--muted);font-size:.95rem;margin:10px 0 0;}\n  .review-title{\n    margin:28px 0 12px;font-size:.78rem;letter-spacing:.18em;\n    text-transform:uppercase;color:var(--muted);font-weight:800;\n  }\n  .review-item{\n    background:var(--panel);border:1px solid var(--line);\n    border-radius:14px;padding:15px 16px;margin-bottom:10px;\n    border-left:4px solid var(--red);\n  }\n  .review-item.ok{border-left-color:var(--green);}\n  .review-q{font-size:.88rem;font-weight:700;line-height:1.5;margin-bottom:8px;}\n  .review-a{font-size:.8rem;line-height:1.6;color:var(--muted);}\n  .review-a b{color:var(--green);}\n  .review-a i{color:var(--red);font-style:normal;}\n\n  footer{\n    text-align:center;margin-top:36px;font-size:.7rem;color:#4e7d6f;\n    letter-spacing:.1em;text-transform:uppercase;line-height:1.9;\n  }\n\n  @media(max-width:520px){\n    .card{height:410px;}\n    .face{padding:22px 18px;}\n    .fc-controls{grid-template-columns:1fr 1fr;}\n    .fc-controls .btn.gold{grid-column:span 2;}\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"app\">\n\n  \u003cheader class=\"hero\">\n    \u003cdiv class=\"brand\">Gold'n Geniuz Online Tutoring Services\u003c/div>\n    \u003ch1>Au-CHIVES\u003c/h1>\n    \u003cp class=\"issue\">VOL 01 · ISS #1 — U1 MECHANICS: Physical Quantities\u003c/p>\n    \u003cp class=\"sub\">Interactive Revision · Flashcards &amp; Quiz\u003c/p>\n  \u003c/header>\n\n  \u003cnav class=\"tabs\">\n    \u003cbutton class=\"tab active\" data-target=\"flashcards\">🃏 Flashcards\u003c/button>\n    \u003cbutton class=\"tab\" data-target=\"quiz\">📝 Quiz\u003c/button>\n  \u003c/nav>\n\n  \u003c!-- ============ FLASHCARDS ============ -->\n  \u003csection id=\"flashcards\" class=\"panel active\">\n    \u003cdiv class=\"fc-bar\">\n      \u003cspan id=\"fcCount\">1 / 20\u003c/span>\n      \u003cspan>Tap card to flip\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"track\">\u003cspan id=\"fcBar\">\u003c/span>\u003c/div>\n\n    \u003cdiv class=\"card\" id=\"card\">\n      \u003cdiv class=\"card-inner\">\n        \u003cdiv class=\"face front\">\n          \u003cdiv class=\"pill\" id=\"fcTagFront\">KEY TERM\u003c/div>\n          \u003ch2 class=\"term\" id=\"fcTerm\">—\u003c/h2>\n          \u003cp class=\"hint\">Tap to reveal\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"face back\">\n          \u003cdiv class=\"pill\" id=\"fcTagBack\">DEFINITION\u003c/div>\n          \u003cp class=\"def\" id=\"fcDef\">—\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"fc-controls\">\n      \u003cbutton class=\"btn\" id=\"fcPrev\">← Prev\u003c/button>\n      \u003cbutton class=\"btn pr
